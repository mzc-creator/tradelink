<script>
  const renderRulesBaseWithNote = renderRules;
  renderRules = function () {
    renderRulesBaseWithNote();
    const table = document.querySelector('#rules-view .rule-table');
    if (!table) return;
    const header = table.tHead.rows[0];
    const statusIndex = [...header.cells].findIndex(cell => cell.textContent.trim() === '状态');
    if (statusIndex < 0) return;
    const noteHeader = document.createElement('th');
    noteHeader.textContent = '备注';
    header.insertBefore(noteHeader, header.cells[statusIndex]);
    const colgroup = table.querySelector('colgroup');
    const noteCol = document.createElement('col');
    colgroup.insertBefore(noteCol, colgroup.children[statusIndex]);
    [15,11,13,11,16,8,10,10,6].forEach((width,index) => {
      if (colgroup.children[index]) colgroup.children[index].style.width = width + '%';
    });
    [...table.tBodies[0].rows].forEach((row,index) => {
      const rule = rules[index];
      const cell = document.createElement('td');
      cell.textContent = rule?.note || '—';
      cell.title = rule?.note || '';
      cell.style.whiteSpace = 'normal';
      cell.style.lineHeight = '1.35';
      row.insertBefore(cell, row.cells[statusIndex]);
    });
  };

  const openRuleModalBaseWithNote = openRuleModal;
  openRuleModal = function (id) {
    openRuleModalBaseWithNote(id);
    const note = rules.find(rule => rule.id === id)?.note || '';
    document.getElementById('note').value = note;
    document.getElementById('note-count').textContent = `${note.length}/200`;
  };

  const saveRuleBaseWithNote = saveRule;
  saveRule = function (event) {
    const editing = editingId;
    const countBefore = rules.length;
    const note = document.getElementById('note').value.trim();
    const valid = selectedSources.length > 0 && !!document.getElementById('rule-name').value.trim() &&
      (method === 'fixed' ? !!document.getElementById('member').value : roundMembers.length >= 2);
    saveRuleBaseWithNote(event);
    if (!valid) return;
    const saved = editing !== null ? rules.find(rule => rule.id === editing) : (rules.length > countBefore ? rules[0] : null);
    if (!saved) return;
    saved.note = note;
    renderRules();
  };

  renderRules();
</script>
