<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeLink · 客户详情</title>
<style>
:root {
  --bg:#f4f6f9; --card:#fff; --text:#0f172a; --muted:#64748b;
  --border:#e8ecf1; --sidebar:#0f172a;
  --gold:#c9a227; --gold-bg:rgba(201,162,39,.1);
  --agent:#7c3aed; --agent-bg:rgba(124,58,237,.08);
  --accent:#0891b2; --green:#16a34a; --green-bg:rgba(22,163,74,.08);
  --orange:#ea580c; --orange-bg:rgba(234,88,12,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;height:100vh;overflow:hidden}
.app-rail{width:76px;background:#f4f4f2;border-right:1px solid #e8e8e4;display:flex;flex-direction:column;align-items:center;padding:10px 6px 12px;flex-shrink:0;height:100%;z-index:20}
.app-rail-logo{width:34px;height:34px;border-radius:50%;background:#111;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:6px;letter-spacing:.02em}
.app-rail-new{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:6px 0 10px;border:none;background:none;cursor:pointer;color:#111;font-size:11px;font-family:inherit;font-weight:500}
.app-rail-new .plus{width:26px;height:26px;border-radius:7px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.app-rail-nav{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.app-rail-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;border-radius:10px;text-decoration:none;color:#555;font-size:10px;line-height:1.2;text-align:center;font-weight:500}
.app-rail-item svg{width:20px;height:20px}
.app-rail-item.active{color:#111;background:#ecece8;font-weight:600}
.app-rail-item:hover{background:#ecece8;color:#111}
.app-rail-more{font-size:16px;letter-spacing:1px;padding:6px 2px}
.app-rail-foot{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px}
.app-rail-pts{font-size:10px;color:#666;font-weight:600}
.app-rail-up{width:100%;border:none;background:#111;color:#fff;border-radius:8px;font-size:10px;padding:6px 4px;cursor:pointer;font-family:inherit;line-height:1.25}
.app-rail-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#c9a227,#a16207)}
.page{flex:1;min-width:0;min-height:0;display:flex;overflow:hidden}

.detail-left{width:320px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.left-back{display:block;padding:8px 14px 2px;font-size:12px;color:var(--muted);text-decoration:none;flex-shrink:0}
.left-back:hover{color:var(--agent)}
.left-id{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;flex-shrink:0}.left-owner-top{margin-left:auto;display:flex;align-items:center}.left-owner-top select{width:96px;height:28px;border:1px solid var(--border);border-radius:6px;background:#fafbfc;color:var(--text);font:600 12px inherit;outline:none;cursor:pointer;padding:0 7px}.left-owner-top select:focus{border-color:rgba(201,162,39,.55)}
.left-stage{display:flex;flex-direction:column;align-items:stretch;gap:3px;margin:0 14px 4px;padding:2px 0;min-width:0}.left-stage span{font-size:11px;color:var(--muted);font-weight:500;line-height:1.3}.left-stage select{width:100%;height:28px;line-height:20px;border:1px solid var(--border);border-radius:6px;background:#fafbfc;color:var(--text);font:500 12px inherit;outline:none;cursor:pointer;padding:4px 8px;box-sizing:border-box}.left-stage select:focus{border-color:rgba(201,162,39,.55)}
.left-profile-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
.left-av{width:32px;height:32px;border-radius:50%;background:#e8e8e4;color:#111;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.left-id-main{flex:1;min-width:0}
.left-name{font-size:15px;font-weight:700;line-height:1.25;word-break:break-word}
.left-type{font-size:11px;color:var(--muted);margin-top:1px}
.left-fields{display:flex;flex-direction:column;justify-content:space-evenly;gap:0;padding:0 14px;flex:1;min-height:0;overflow-y:auto}
.sys-box{flex-shrink:0;margin:6px 14px 8px;padding:8px 10px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--muted);line-height:1.5}
.sys-title{font-size:11px;font-weight:700;color:var(--text);margin-bottom:4px}
.sys-row{display:flex;gap:8px;align-items:flex-start}
.sys-row span{flex-shrink:0;width:52px;color:#94a3b8}
.weak-link{font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;padding:0;margin:0 14px 12px;align-self:flex-start;flex-shrink:0}
.weak-link:hover{color:var(--agent);text-decoration:underline}

.detail-right{flex:1;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 20px 40px}
.detail-right > *{margin-bottom:12px}
.detail-right > *:last-child{margin-bottom:0}
.mod{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.mod-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.mod.collapsible .mod-head{cursor:pointer;user-select:none}
.mod.collapsible .mod-head:hover{background:#fafbfc}
.mod.collapsed .mod-head{border-bottom:none}
.mod.collapsed .mod-body{display:none}
.mod-head h3{font-size:14px;font-weight:700}
.mod-head span,.mod-link{font-size:12px;color:var(--muted);font-weight:500}
.contacts-head-actions{display:flex;align-items:center;gap:8px}.add-contact-btn{border:1px solid rgba(124,58,237,.28);border-radius:6px;background:#fff;color:var(--agent);font:600 12px inherit;padding:5px 9px;cursor:pointer}.add-contact-btn:hover{background:var(--agent-bg);border-color:rgba(124,58,237,.45)}
.mod-toggle{font-size:12px;color:var(--agent);font-weight:600}
.mod-link{border:none;background:none;cursor:pointer;font-family:inherit;color:var(--agent);font-weight:600}
.mod-body{padding:14px 16px}

.hero-badges{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;align-items:center}
.tag{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;border:1px solid var(--border);background:var(--bg);color:var(--muted);flex-shrink:0}
.tag-status{color:#92400e;background:var(--gold-bg);border-color:rgba(201,162,39,.3)}
.tag-source{color:var(--accent);background:rgba(8,145,178,.08);border-color:rgba(8,145,178,.2)}
.tag-type{color:#1d4ed8;background:#dbeafe;border-color:#93c5fd}
.tag-country{color:#0f766e;background:#ccfbf1;border-color:#5eead4}
.tag-src-agent{color:#92400e;background:var(--gold-bg);border-color:rgba(201,162,39,.3)}

.tabs,.tab,.content,.overview-wrap,.content-padded{display:none}

.ai-strategy{padding:14px 16px;background:linear-gradient(135deg,#fdfaf5 0%,#fff 60%);border:1px solid rgba(245,166,35,.18);border-radius:12px}
.ai-strategy-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ai-strategy-icon{font-size:14px;font-weight:800;color:#f5a623;font-style:italic}
.ai-strategy-title{font-size:14px;font-weight:700;color:#f5a623}
.ai-strategy-line{font-size:13px;line-height:1.65;color:#334155;margin-bottom:4px}
.ai-strategy-line strong{margin-right:6px}
.ai-strategy-line em{font-style:normal;color:var(--muted);margin-right:4px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.kpi-card dt{font-size:10px;color:var(--muted);margin-bottom:4px}
.kpi-card dd{font-size:14px;font-weight:700;line-height:1.3}
.kpi-card dd small{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:2px}
.kpi-card dd a{color:var(--agent);text-decoration:none;font-size:13px}
.kpi-card.highlight{border-color:rgba(245,166,35,.35);background:linear-gradient(135deg,rgba(245,166,35,.06),var(--card))}
.overview-main{display:block}
.overview-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-height:0}
.mod.contacts-mod{overflow:visible}
.overview-card.ov-follow .follow-box{border:none;border-radius:0}
.overview-card-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:#fafbfc}
.overview-card-head h3{font-size:12px;font-weight:600}
.overview-card-body{padding:12px 14px;font-size:12px;line-height:1.6}
.trade-mini-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.trade-mini-row:last-child{border-bottom:none}
.trade-mini-row span{color:var(--muted)}
.recent-link{font-size:11px;color:var(--agent);cursor:pointer;background:none;border:none;font-family:inherit;font-weight:600}
.recent-item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.recent-item:last-child{border-bottom:none;padding-bottom:0}
.recent-title{font-size:13px;font-weight:600;line-height:1.45;color:var(--text)}
.recent-item time{font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0;padding-top:2px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}}

.follow-box{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
.follow-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px;background:#fff}
.follow-head h3{font-size:14px;font-weight:600}
.follow-input{display:block;width:100%;min-height:88px;padding:12px 14px;border:none;border-top:1px solid var(--border);font-size:13px;font-family:inherit;resize:vertical;outline:none;background:#fff;color:var(--text)}
.follow-files{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;background:#fff}
.follow-files:empty{display:none}
.follow-file-chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 8px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12px;color:var(--text);line-height:1.3}
.follow-file-chip svg{width:13px;height:13px;flex-shrink:0;color:#64748b}
.follow-file-chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.follow-file-chip button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 0 0 2px;font-family:inherit}
.follow-file-chip button:hover{color:#b91c1c}
.follow-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--border);background:#fff}
.follow-time-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.follow-time-wrap label{font-size:13px;font-weight:650;color:var(--text);white-space:nowrap}
.follow-time-wrap input{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none}
.follow-time-wrap input:focus{border-color:rgba(201,162,39,.45)}
.follow-attach{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border:none;background:none;color:#475569;cursor:pointer;border-radius:8px;flex-shrink:0}
.follow-attach svg{width:18px;height:18px}
.follow-attach:hover{color:#92400e;background:rgba(201,162,39,.08)}
.follow-attach.has-files{color:#92400e}
.btn{padding:7px 18px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--gold);color:#fff}

.co-field{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:2px 0;min-width:0;cursor:text;background:transparent;border:none;border-radius:0;flex:1 1 0}
.co-field dt{font-size:11px;color:var(--muted);font-weight:500;margin:0;line-height:1.3;flex:none}
.co-field dd{font-size:12px;font-weight:500;height:28px;line-height:20px;word-break:break-word;color:var(--text);padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:#fafbfc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.co-field.prose dd{font-weight:500;color:#334155;white-space:nowrap;display:block;-webkit-line-clamp:unset}
.co-field dd.ph{color:#94a3b8;font-weight:400}
.co-field:hover dd{border-color:rgba(201,162,39,.4)}
.co-link{color:var(--agent);text-decoration:none;font-weight:600}
.co-link:hover{text-decoration:underline}
.co-field[data-editing="1"]{background:transparent;border:none;padding:2px 0;box-shadow:none}
.co-field[data-editing="1"] dd,.co-field[data-editing="1"]:hover dd{color:var(--text);white-space:normal;height:auto;overflow:auto}
.co-field[data-editing="1"] .inline-input{width:100%;height:28px;border:1px solid rgba(201,162,39,.45);border-radius:6px;background:#fffef8;font:inherit;font-size:12px;font-weight:500;padding:4px 8px;outline:none;resize:none;font-family:inherit;box-sizing:border-box}
.co-field textarea.inline-input{height:28px;min-height:28px;max-height:28px;line-height:20px}

.pcard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:stretch;width:100%}
.pcard-grid.contact-scroll{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding-bottom:5px}.pcard-grid.contact-scroll .pcard{flex:0 0 calc(50% - 5px);scroll-snap-align:start}.pcard-grid.contact-scroll::-webkit-scrollbar{height:6px}.pcard-grid.contact-scroll::-webkit-scrollbar-thumb{background:#d7dee8;border-radius:999px}@media(max-width:700px){.pcard-grid.contact-scroll .pcard{flex-basis:86%}}
.pcard{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:0;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:8px;overflow:visible}
.pcard:hover{border-color:rgba(124,58,237,.28);box-shadow:0 2px 10px rgba(15,23,42,.05)}
@media(max-width:1100px){.pcard-grid{grid-template-columns:1fr}}
.pcard-h{display:flex;align-items:center;gap:8px;min-width:0}
.pcard-av{width:28px;height:28px;border-radius:50%;background:#e0e7ff;color:#4338ca;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.pcard-h-main{flex:1;min-width:0;overflow:visible}
.pcard-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;overflow:visible}
.pcard-name-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-role{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
.pcard-ico{width:28px;height:28px;border:none;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.pcard-ico svg{width:15px;height:15px}
.pcard-ico.mail{background:#f1f5f9;color:#64748b}
.pcard-ico.mail:hover{background:#e2e8f0;color:#334155}
.pcard-ico.wa{background:#dcfce7;color:#16a34a}
.pcard-ico.wa:hover{background:#bbf7d0;color:#15803d}
.duplicate-wrap{position:relative;display:flex}
.duplicate-tag{height:auto;padding:2px 6px;border:1px solid #f2c36b;border-radius:999px;background:#fff8e8;color:#a16207;font:600 10px/1.2 inherit;cursor:pointer;white-space:nowrap}
.duplicate-tag:hover,.duplicate-wrap:focus-within .duplicate-tag{background:#fff0c9;color:#92400e}
.duplicate-popover{position:absolute;left:-42px;top:29px;width:260px;padding:10px 12px 8px;background:#fff;border:1px solid #e6eaf0;border-radius:10px;box-shadow:0 8px 20px rgba(15,23,42,.14);z-index:20;opacity:0;visibility:hidden;transform:translateY(-4px);pointer-events:none;transition:opacity .16s ease,transform .16s ease,visibility .16s}
.duplicate-wrap:hover .duplicate-popover,.duplicate-wrap:focus-within .duplicate-popover{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
.duplicate-popover::before{content:'';position:absolute;left:50px;top:-5px;width:9px;height:9px;background:#fff;border-left:1px solid #e6eaf0;border-top:1px solid #e6eaf0;transform:rotate(45deg)}
.duplicate-popover-head{font-size:12px;font-weight:500;color:#334155;margin-bottom:8px}.duplicate-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 0}.duplicate-item-main{min-width:0}.duplicate-name{font-size:13px;color:#c68a13;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.duplicate-name-link{border:none;background:none;padding:0;color:#c68a13;font:500 13px inherit;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.duplicate-name-link:hover{text-decoration:underline;color:#a16207}.duplicate-reason{flex:0 0 auto;max-width:112px;font-size:11px;color:#64748b;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.duplicate-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:9px;padding-top:7px;border-top:1px solid #f1f5f9}.duplicate-action{min-width:38px;height:24px;border:1px solid #e2e8f0;border-radius:3px;background:#fff;padding:0 8px;font:500 12px inherit;cursor:pointer;color:#64748b}.duplicate-action:hover{color:#334155;background:#f8fafc}.duplicate-action.merge{border-color:#c89a2e;background:#c89a2e;color:#fff}.duplicate-action.merge:hover{background:#b78416}
.pcard-reach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-width:0}
.pcard-kv{min-width:0;overflow:hidden}
.pcard-kv dt{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:2px}
.pcard-kv dd{font-size:11px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-notes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;min-width:0}
.pcard-notes:has(.pcard-note:only-child){grid-template-columns:minmax(0,1fr)}
.pcard-note{font-size:11px;line-height:1.4;color:#334155;background:#fff;border-left:3px solid #94a3b8;padding:5px 8px;border-radius:0 6px 6px 0;display:flex;align-items:baseline;gap:6px;min-width:0;overflow:hidden}
.pcard-note b{font-size:10px;color:var(--muted);flex-shrink:0;white-space:nowrap}
.pcard-note span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-note.suggest{background:#f0fdf4;border-left-color:#16a34a}
.badge-primary{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--gold-bg);color:#92400e;flex-shrink:0;white-space:nowrap}
.email-line{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden}
.email-addr{font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.email-type{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.email-type.corp{color:#0369a1;background:rgba(3,105,161,.06)}
.social-cell{display:flex;gap:4px}
.social-icon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-decoration:none}
.social-icon.li{background:#0a66c2}.social-icon.fb{background:#1877f2}.social-icon.tw{background:#1da1f2}

.feed-timeline{position:relative;padding-left:36px}
.feed-timeline::before{content:'';position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--border)}
.feed-item{position:relative;margin-bottom:14px}
.feed-item:last-child{margin-bottom:0}
.feed-icon{position:absolute;left:-36px;top:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.feed-icon.follow{background:var(--orange-bg);color:var(--orange)}
.feed-icon.system{background:var(--agent-bg);color:var(--agent)}
.feed-icon.chat{background:var(--green-bg);color:var(--green)}
.feed-head{margin-bottom:6px;font-size:13px;font-weight:600;line-height:1.4}
.feed-head span{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.feed-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.feed-file{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:12px;color:var(--text)}
.feed-file svg{width:12px;height:12px;color:#64748b}
.change-table{width:100%;border-collapse:collapse;font-size:12px}
.change-table th,.change-table td{padding:6px 10px;border:1px solid var(--border);text-align:left}

  ['new-contact-name','new-contact-role','new-contact-email','new-contact-wa','new-contact-phone','new-contact-social-url','new-contact-notes'].forEach(id=>{const field=document.getElementById(id);if(field)field.value=''});

  if(quotaLockedCurrent()){closeAddContact();quotaLimitToast();return}

  if(!name){input?.focus();return}

function duplicateCandidatesFor(person){
  return person?(DUPLICATE_CANDIDATES[person.id]||[]).filter(item=>!ignoredDuplicateIds.has(item.id)):[];
}
function duplicatePopoverHTML(person,index,duplicates){
  const rows=duplicates.map(item=>{
    const rawReason=item.linkReason||'联系方式相同';
    const reason=/whatsapp/i.test(rawReason)&&/相同/.test(rawReason)?'WA相同':rawReason;
    return `<div class="duplicate-item"><button class="duplicate-name-link" type="button" onclick="event.stopPropagation();openDuplicateContactDrawer('${escHtml(person.id)}','${escHtml(item.id)}')">${escHtml(item.name)}</button><div class="duplicate-reason">（${escHtml(reason)}）</div></div>`;
  }).join('');
  return `<div class="duplicate-wrap"><button class="duplicate-tag" type="button" title="发现 ${duplicates.length} 个重复联系人" aria-label="发现 ${duplicates.length} 个重复联系人" onclick="event.stopPropagation()">存在重复</button><div class="duplicate-popover" role="tooltip"><div class="duplicate-popover-head">发现${duplicates.length}个重复联系人</div>${rows}<div class="duplicate-actions"><button class="duplicate-action" type="button" onclick="event.stopPropagation();ignoreDuplicate('${escHtml(person.id)}')">忽略</button><button class="duplicate-action merge" type="button" onclick="event.stopPropagation();openMergeModal(${index})">合并</button></div></div></div>`;
}

function coFieldInner(key,label,val){
  const empty=!val;
  if(empty) return `<dt>${label}</dt><dd class="ph">请输入</dd>`;
  if(key==='website'){
    const href=/^https?:/i.test(val)?val:'https://'+val;
    return `<dt>${label}</dt><dd><a class="co-link" href="${escHtml(href)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escHtml(val)}</a></dd>`;
  }
  if(key==='country') return `<dt>${label}</dt><dd>${escHtml(val)}</dd>`;
  if(key==='email') return `<dt>${label}</dt><dd><a class="co-link" href="mailto:${escHtml(val)}" onclick="event.stopPropagation()">${escHtml(val)}</a></dd>`;
  return `<dt>${label}</dt><dd>${escHtml(val)}</dd>`;
}
function coFieldHTML(key,label,opts){
  let val=(c[key]||'').trim();
  if(key==='country') val=countryZh(val)||val;
  const multi=opts?.multi?'1':'0';
  const prose=opts?.prose?' prose':'';
  return `<div class="co-field${prose}" data-key="${key}" data-label="${label}" data-multi="${multi}" onclick="beginCoEdit(this)">
    ${coFieldInner(key,label,val)}</div>`;
}
function ensureCompanyMulti(key){
  const listKey=key==='email'?'emails':'phones';
  if(!Array.isArray(c[listKey])) c[listKey]=c[key]?[c[key]]:[''];
  if(!c[listKey].length) c[listKey]=[''];
  return c[listKey];
}
function companyMultiFieldHTML(key,label){
  const values=ensureCompanyMulti(key);
  const type=key==='email'?'email':'tel';
  const rows=values.map((value,index)=>`<div class="company-multi-row"><input type="${type}" value="${escHtml(value)}" placeholder="请输入${label}" onblur="commitCompanyMulti('${key}',${index},this.value)">${values.length>1?`<button type="button" aria-label="删除${label}" onclick="removeCompanyMulti('${key}',${index})">×</button>`:''}</div>`).join('');
  return `<div class="co-field company-multi"><dt>${label}<button class="company-add" type="button" title="添加${label}" aria-label="添加${label}" ${values.length>=5?'disabled':''} onclick="addCompanyMulti('${key}')">+</button></dt><div class="company-multi-rows">${rows}</div></div>`;
}
function commitCompanyMulti(key,index,value){
  const values=ensureCompanyMulti(key); values[index]=String(value||'').trim();
  c[key]=values.find(Boolean)||'';
  toast('已保存');
}
function addCompanyMulti(key){
  const values=ensureCompanyMulti(key);
  if(values.length>=5){toast('最多可添加 5 个'+(key==='email'?'邮箱':'电话'));return}
  values.push(''); renderLeft();
  document.querySelectorAll(`.company-multi input[type="${key==='email'?'email':'tel'}"]`)[values.length-1]?.focus();
}
function removeCompanyMulti(key,index){
  const values=ensureCompanyMulti(key); values.splice(index,1);
  c[key]=values.find(Boolean)||''; renderLeft(); toast('已删除');
}
function beginCoEdit(el){
  if(el.dataset.editing==='1') return;
  document.querySelectorAll('.co-field[data-editing="1"]').forEach(o=>{if(o!==el)o.querySelector('.inline-input')?.blur()});
  const key=el.dataset.key, multi=el.dataset.multi==='1';
  let val=c[key]||'';
  if(key==='country') val=countryZh(val)||val;
  el.dataset.editing='1';
  el.innerHTML=multi
    ? `<dt>${el.dataset.label}</dt><textarea class="inline-input" onblur="commitCoEdit(this)">${escHtml(val)}</textarea>`
    : `<dt>${el.dataset.label}</dt><input class="inline-input" value="${escHtml(val)}" onblur="commitCoEdit(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">`;
  const inp=el.querySelector('.inline-input'); inp.focus();
}
function commitCoEdit(inp){
  const el=inp.closest('.co-field'); if(!el) return;
  const key=el.dataset.key, next=inp.value.trim(), prev=(c[key]||'').trim();
  c[key]=next; el.dataset.editing='0';
  const shown=key==='country'?(countryZh(next)||next):next;
  el.innerHTML=coFieldInner(key,el.dataset.label,shown);
  if(next!==prev){ toast('已保存'); }
}

function dashVal(v){const s=String(v||'').trim();return (!s||s==='—')?'':s}

const SOCIAL_PLATFORMS=['LinkedIn','Facebook','Twitter','Instagram','YouTube','TikTok','其他'];
const DIAL_CODES=[{code:'+1',name:'美国'},{code:'+86',name:'中国'},{code:'+44',name:'英国'},{code:'+49',name:'德国'},{code:'+55',name:'巴西'},{code:'+81',name:'日本'},{code:'+46',name:'瑞典'},{code:'+33',name:'法国'},{code:'+61',name:'澳大利亚'},{code:'+82',name:'韩国'},{code:'+971',name:'阿联酋'}];
function dialOptions(selected){
  return `<option value="">请选择</option>`+DIAL_CODES.map(d=>`<option value="${d.code}" ${selected===d.code?'selected':''}>${d.code}${d.name}</option>`).join('');
}
function parseDial(raw){
  const s=String(raw||'').trim();
  const sorted=[...DIAL_CODES].sort((a,b)=>b.code.length-a.code.length);
  for(const d of sorted){ if(s.startsWith(d.code)) return {code:d.code, number:s.slice(d.code.length).replace(/^[\s-]+/,'')}; }
  const m=s.match(/^(\+\d{1,4})\s*(.*)$/);
  if(m) return {code:m[1], number:m[2]};
  return {code:'', number:s};
}
function joinDial(code,number){return [code, String(number||'').trim()].filter(Boolean).join(' ').trim()}
function ensurePerson(p){
  if(!p.was) p.was=dashVal(p.wa)?[p.wa]:[''];
  if(!p.was.length) p.was=[''];
  if(!p.phones) p.phones=dashVal(p.phone)?[p.phone]:[''];
  if(!p.phones.length) p.phones=[''];
  if(!p.emails) p.emails=[];
  if(!p.emails.length && dashVal(p.email)) p.emails=[{address:p.email,type:'corporate',status:'verified'}];
  if(!p.emails.length) p.emails=[{address:'',type:'corporate',status:'verified'}];
  if(!p.socials){
    p.socials=[];
    if(dashVal(p.linkedin)) p.socials.push({platform:'LinkedIn',url:p.linkedin});
    else if(p.social?.linkedin) p.socials.push({platform:'LinkedIn',url:''});
    if(p.social?.facebook && !p.socials.some(s=>s.platform==='Facebook')) p.socials.push({platform:'Facebook',url:''});
    if(p.social?.twitter) p.socials.push({platform:'Twitter',url:''});
  }
  if(!p.socials.length) p.socials=[{platform:'',url:''}];
  return p;
}

  const rows=['name','notes'].map(key=>{
    const values=uniqueObjects(records.map(item=>({id:item.id,label:item.name,value:String(item[key]||'').trim()})).filter(item=>item.value),item=>item.value);
    if(values.length<2) return '';
    const selected=activeMerge.fieldSources[key]||'auto';
    return `<div class="merge-conflict-row"><div class="merge-conflict-label">${key==='name'?'姓名':'备注'}</div><div class="merge-conflict-options"><label><input type="radio" name="merge-${key}" value="auto" ${selected==='auto'?'checked':''} onchange="setMergeFieldSource('${key}','auto')"><span>推荐：最新优先</span></label>${values.map(item=>`<label title="${escHtml(item.value)}"><input type="radio" name="merge-${key}" value="${escHtml(item.id)}" ${selected===item.id?'checked':''} onchange="setMergeFieldSource('${key}','${escHtml(item.id)}')"><span>${escHtml(item.label)}：${escHtml(item.value)}</span></label>`).join('')}</div></div>`;
  }).join('');
  return rows?`<div class="merge-conflicts"><h3>字段冲突</h3><p>系统已给出推荐值；可按字段覆盖选择，不影响联系方式与历史记录的完整保留。</p>${rows}</div>`:'';
}
function mergeContactRowHTML(person,isRecommended){
  const phone=contactValues(person,'phone')[0]||'';
  const email=contactValues(person,'email')[0]||'';
  const wa=contactValues(person,'wa')[0]||'';
  const company=person.companyName||c.name||'';
  const selected=activeMerge.masterId===person.id;
  return `<label class="merge-contact-row ${selected?'selected':''}">
    <input class="merge-contact-radio" type="radio" name="merge-master" value="${escHtml(person.id)}" ${selected?'checked':''} onchange="setMergeMaster('${escHtml(person.id)}')">
    <span class="merge-contact-avatar">${escHtml(initialsOf(person.name))}</span>
    <span class="merge-contact-info">
      <span class="merge-contact-head"><span class="merge-contact-name"><span class="merge-contact-name-text">${escHtml(person.name||'—')}</span>${isRecommended?'<span class="merge-recommended">推荐</span>':''}</span><span class="merge-contact-company">${escHtml(company||'—')}</span></span>
      <span class="merge-contact-meta">${phone?`<span class="merge-meta-phone">${escHtml(phone)}</span>`:''}${email?`<span class="merge-meta-email">${escHtml(email)}</span>`:''}${wa?`<span class="merge-meta-wa">${escHtml(wa)}</span>`:''}</span>
    </span>
  </label>`;
}
function mergeAutoContentHTML(){
  return `<div class="merge-auto"><div class="merge-auto-title"><span class="merge-auto-info">i</span><span>将自动合并的内容（不需要手动选择）</span></div><div class="merge-auto-items"><span class="merge-auto-item"><span class="merge-auto-icon">◈</span><span class="merge-auto-item-name">联系方式</span><strong class="merge-auto-item-action">合并去重</strong></span><span class="merge-auto-item"><span class="merge-auto-icon">◇</span><span class="merge-auto-item-name">社媒</span><strong class="merge-auto-item-action">合并去重</strong></span><span class="merge-auto-item"><span class="merge-auto-icon">▤</span><span class="merge-auto-item-name">跟进记录</span><strong class="merge-auto-item-action">合并</strong></span><span class="merge-auto-item"><span class="merge-auto-icon">▣</span><span class="merge-auto-item-name">私信互动</span><strong class="merge-auto-item-action">合并</strong></span><span class="merge-auto-item"><span class="merge-auto-icon">⌑</span><span class="merge-auto-item-name">备注</span><strong class="merge-auto-item-action">合并</strong></span></div></div>`;
}
function renderMergeModal(){
  const primary=c.contacts?.[activeMerge?.contactIndex];
  const candidates=mergeCandidates();
  if(!primary||!candidates.length) return closeMergeModal();
  const choices=(DUPLICATE_CANDIDATES[primary.id]||[]).filter(item=>!ignoredDuplicateIds.has(item.id));
  const rows=[mergeContactRowHTML(primary,true),...choices.map(candidate=>mergeContactRowHTML(candidate,false))].join('');
  const autoContent=mergeAutoContentHTML();
  document.getElementById('merge-modal').innerHTML=`<div class="merge-head"><div><h2 id="merge-title">合并联系人</h2></div><button class="cdrawer-close" type="button" aria-label="关闭" onclick="closeMergeModal()">×</button></div><div class="merge-body"><p class="merge-intro">请选择要保留的联系人，其他联系人将自动合并到该联系人。</p><div class="merge-contact-list">${rows}</div>${autoContent}</div><div class="merge-foot"><button class="btn btn-primary" type="button" onclick="confirmMerge()">确定合并</button></div>`;
}
function openMergeModal(contactIndex){
  const primary=c.contacts?.[contactIndex];
  const candidates=duplicateCandidatesFor(primary);
  if(!primary||!candidates.length) return;
  activeMerge={contactIndex,candidateIds:candidates.map(item=>item.id),masterId:primary.id,company:c.name||primary.companyName||'',fieldSources:{name:'auto',notes:'auto'}};
  renderMergeModal();
  document.getElementById('merge-mask').classList.add('show');
  document.getElementById('merge-modal').classList.add('show');
}
function toggleMergeCandidate(candidateId,checked){
  if(!activeMerge) return;
  const next=checked?[...new Set([...activeMerge.candidateIds,candidateId])]:activeMerge.candidateIds.filter(id=>id!==candidateId);
  if(!next.length){toast('请至少选择一位相似联系人');return}
  activeMerge.candidateIds=next;
  if(!next.includes(activeMerge.masterId) && activeMerge.masterId!==c.contacts?.[activeMerge.contactIndex]?.id) activeMerge.masterId=c.contacts?.[activeMerge.contactIndex]?.id;
  renderMergeModal();
}
function setMergeCompany(company){if(activeMerge) activeMerge.company=company;}
function setMergeMaster(id){if(activeMerge) activeMerge.masterId=id;renderMergeModal();}
function setMergeFieldSource(key,id){if(activeMerge){activeMerge.fieldSources[key]=id;renderMergeModal();}}
function closeMergeModal(){
  document.getElementById('merge-mask')?.classList.remove('show');
  document.getElementById('merge-modal')?.classList.remove('show');
  activeMerge=null;
}
let mergedSuccessPerson=null;
function mergeSuccessSocialLabel(platform){
  const key=String(platform||'').trim().toLowerCase();
  return ({linkedin:'in',facebook:'f',twitter:'𝕏',instagram:'ig',youtube:'▶',tiktok:'♪'})[key]||'•';
}
function showMergeSuccess(person,count){
  mergedSuccessPerson=person;
  const phone=contactValues(person,'phone')[0]||'';
  const email=contactValues(person,'email')[0]||'';
  const wa=contactValues(person,'wa')[0]||'';
  const socials=uniqueSocialEntries(person);
  const visibleSocials=socials.slice(0,2);
  const extraSocialCount=Math.max(0,socials.length-visibleSocials.length);
  document.getElementById('merge-success-copy').textContent=`已将 ${count} 个联系人合并为 1 个联系人。`;
  document.getElementById('merge-success-contact').innerHTML=`<div class="merge-success-person"><div class="merge-success-avatar">${escHtml(initialsOf(person.name))}</div><div class="merge-success-main"><div class="merge-success-name-row"><div class="merge-success-name">${escHtml(person.name||'—')}</div></div><div class="merge-success-company">${escHtml(person.companyName||c.name||'—')}</div></div></div><div class="merge-success-details">${phone?`<div class="merge-success-detail"><span class="merge-success-detail-icon">⌕</span><span class="merge-success-detail-value">${escHtml(phone)}</span></div>`:''}${email?`<div class="merge-success-detail"><span class="merge-success-detail-icon">✉</span><span class="merge-success-detail-value">${escHtml(email)}</span></div>`:''}${wa?`<div class="merge-success-detail"><span class="merge-success-detail-icon">◉</span><span class="merge-success-detail-value">${escHtml(wa)}</span></div>`:''}</div>${visibleSocials.length||extraSocialCount?`<div class="merge-success-socials">${visibleSocials.map(item=>`<span class="merge-success-social" title="${escHtml(item.platform||'社媒')}">${escHtml(mergeSuccessSocialLabel(item.platform))}</span>`).join('')}${extraSocialCount?`<span class="merge-success-social merge-success-social-more">+${extraSocialCount}</span>`:''}</div>`:''}`;
  document.getElementById('merge-success-overlay')?.classList.add('show');
}
function closeMergeSuccess(){
  document.getElementById('merge-success-overlay')?.classList.remove('show');
  mergedSuccessPerson=null;
}
function viewMergedContactDetails(){
  const person=mergedSuccessPerson;
  closeMergeSuccess();
  if(!person) return;
  drawerPerson=ensurePerson(person);
  const el=document.getElementById('cdrawer');
  if(!el) return;
  el.innerHTML=contactDrawerHTML(person);
  el.classList.add('show');
  document.getElementById('cdrawer-mask')?.classList.add('show');
}
function openDuplicateContactDrawer(primaryId,candidateId){
  const candidate=(DUPLICATE_CANDIDATES[primaryId]||[]).find(item=>item.id===candidateId);
  if(!candidate) return;
  // 复用联系人档案抽屉，查看重复候选人的完整联系方式与备注。
  drawerPerson=ensurePerson(candidate);
  const el=document.getElementById('cdrawer');
  if(!el) return;
  el.innerHTML=contactDrawerHTML(candidate);
  el.classList.add('show');
  document.getElementById('cdrawer-mask')?.classList.add('show');
}
function confirmMerge(){
  if(!activeMerge) return;
  const primary=c.contacts?.[activeMerge.contactIndex];
  const candidates=mergeCandidates();
  if(!primary||!candidates.length) return closeMergeModal();
  const records=[primary,...candidates];
  const master=records.find(item=>item.id===activeMerge.masterId)||primary;
  const mergeOrder=[master,...records.filter(item=>item.id!==master.id)];
  ensurePerson(primary);
  mergeOrder.forEach(ensurePerson);
  primary.phones=uniqueContactValues(mergeOrder.flatMap(item=>contactValues(item,'phone')),'phone');
  primary.was=uniqueContactValues(mergeOrder.flatMap(item=>contactValues(item,'wa')),'wa');
  primary.emails=uniqueContactValues(mergeOrder.flatMap(item=>contactValues(item,'email')),'email').map(address=>({address,type:'corporate',status:'verified'}));
  primary.phone=primary.phones[0]||''; primary.wa=primary.was[0]||''; primary.email=primary.emails[0]?.address||'';
  primary.name=master.name||latestLongestValue(records,'name');
  primary.role=master.role||primary.role;
  primary.notes=master.notes||master.preference||latestLongestValue(records,'notes');
  primary.socials=uniqueObjects(mergeOrder.flatMap(socialEntries),item=>`${String(item.platform||'').toLowerCase()}|${String(item.url||'').toLowerCase()}`);
  primary.tags=[...new Set(mergeOrder.flatMap(item=>item.tags||[]))];
  primary.sources=[...new Set(records.map(item=>item.source).filter(Boolean))];
  primary.source=master.source||primary.source||primary.sources[0]||'';
  primary.activities=uniqueObjects(mergeOrder.flatMap(item=>item.activities||[]),item=>item.id||`${item.type}|${item.time}|${item.content}`);
  primary.updatedAt=records.map(item=>item.updatedAt||'').sort().at(-1)||primary.updatedAt;
  primary.companyName=master.companyName||activeMerge.company||c.name;
  primary.mergeAudit={mergedAt:'刚刚',masterRecordId:master.id,memberIds:records.map(item=>item.id),company:primary.companyName};
  candidates.forEach(candidate=>ignoredDuplicateIds.add(candidate.id));
  const mergedCount=records.length;
  closeMergeModal();
  renderRight();
  showMergeSuccess(primary,mergedCount);
}
function openContactDrawer(i){
  if(quotaLockedCurrent()){ quotaLimitToast(); return; }
  const p=c.contacts?.[i]; if(!p) return;
  drawerPerson=ensurePerson(p);
  const el=document.getElementById('cdrawer');
  el.innerHTML=contactDrawerHTML(p);
  el.classList.add('show');
  document.getElementById('cdrawer-mask').classList.add('show');
}
function closeContactDrawer(){
  document.querySelectorAll('.pf-field[data-editing="1"] .inline-input').forEach(inp=>inp.blur());
  document.getElementById('cdrawer')?.classList.remove('show');
  document.getElementById('cdrawer-mask')?.classList.remove('show');
  const box=document.getElementById('detail-right'); const top=box?.scrollTop||0;
  renderRight();
  if(box) box.scrollTop=top;
}
function openWaChat(phone,name){
  if(quotaLockedCurrent()){ quotaLimitToast(); return; }
  const hasChat=(c.activities||[]).some(a=>a.type==='chat'&&a.contact===name);
  if(hasChat){
    if(!timelineOpen) toggleMod('timeline');
    document.getElementById('mod-timeline')?.scrollIntoView({behavior:'smooth',block:'start'});
    toast('已打开与 '+(name||'联系人')+' 的对话');
    setTimeout(()=>{
      const item=[...document.querySelectorAll('.feed-item')].find(el=>el.textContent.includes(name||'')&&el.textContent.includes('私信'));
      item?.scrollIntoView({behavior:'smooth',block:'center'});
    },60);
    return;
  }
  const digits=String(phone||'').replace(/\D/g,'');
  if(digits) window.open('https://wa.me/'+digits,'_blank','noopener');
  else toast('暂无 WhatsApp 对话');
}
function toast(msg){
  let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}
  t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);
}
if(isEnt){
  renderLeft();
  renderRight();
  if(qs.get('follow')==='1') setTimeout(()=>document.getElementById('follow-slot')?.scrollIntoView({behavior:'smooth',block:'center'}),40);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('crm-tour-complete')?.classList.contains('show')){closeCrmTourComplete();return}if(document.getElementById('merge-success-overlay')?.classList.contains('show')){closeMergeSuccess();return}if(document.getElementById('add-contact-mask')?.classList.contains('show')){closeAddContact();return}closeContactDrawer()}});
function startCrmTourFromDetail(){
  location.href='crm-v2.html?tour=1';
}
function showCrmTourComplete(){
  const overlay=document.getElementById('crm-tour-complete');
  if(!overlay)return;
  overlay.classList.add('show');
  setTimeout(()=>overlay.querySelector('.btn')?.focus(),120);
}
function closeCrmTourComplete(){
  document.getElementById('crm-tour-complete')?.classList.remove('show');
}
function startDetailTour(force){
  if(!window.TradeOnboarding) return;
  const steps=[
    {kicker:'客户管理', sel:'#tour-customer-profile', title:'客户档案', body:'客户信息一览无余，及时维护沉淀客户资料。', placement:'right'},
    {kicker:'客户管理', sel:'#tour-ai-strategy', title:'AI策略', body:'AI精准识别客户痛点，并推荐定制化行动策略。'},
    {kicker:'客户管理', sel:'#mod-contacts', title:'联系人信息', body:'汇集公司全部联系人，查看 WhatsApp、邮箱和电话，一键触达。'},
    {kicker:'客户管理', sel:'#follow-slot', title:'写跟进', body:'每次沟通记一笔，助力成交转化。', doneLabel:'完成'}
  ].filter(function(s){return !s.sel||s.before||document.querySelector(s.sel);});
  TradeOnboarding.start(steps,{storageKey:'crm',force:!!force,offset:1,total:5,backHref:'crm-v2.html?tour=1',onComplete:showCrmTourComplete});
}
if(isEnt){
  setTimeout(function(){ if(qs.get('tour')==='1') startDetailTour(true); },500);
}
</script>
