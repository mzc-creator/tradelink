<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeLink · 客户详情</title>
<style>
:root {
  --bg:#f4f6f9; --card:#fff; --text:#0f172a; --muted:#64748b;
  --border:#e8ecf1; --sidebar:#0f172a;
  --gold:#c9a227; --gold-bg:rgba(201,162,39,.1);
  --agent:#7c3aed; --agent-bg:rgba(124,58,237,.08);
  --accent:#0891b2; --green:#16a34a; --green-bg:rgba(22,163,74,.08);
  --orange:#ea580c; --orange-bg:rgba(234,88,12,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;height:100vh;overflow:hidden}
.app-rail{width:76px;background:#f4f4f2;border-right:1px solid #e8e8e4;display:flex;flex-direction:column;align-items:center;padding:10px 6px 12px;flex-shrink:0;height:100%;z-index:20}
.app-rail-logo{width:34px;height:34px;border-radius:50%;background:#111;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:6px;letter-spacing:.02em}
.app-rail-new{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:6px 0 10px;border:none;background:none;cursor:pointer;color:#111;font-size:11px;font-family:inherit;font-weight:500}
.app-rail-new .plus{width:26px;height:26px;border-radius:7px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.app-rail-nav{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.app-rail-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;border-radius:10px;text-decoration:none;color:#555;font-size:10px;line-height:1.2;text-align:center;font-weight:500}
.app-rail-item svg{width:20px;height:20px}
.app-rail-item.active{color:#111;background:#ecece8;font-weight:600}
.app-rail-item:hover{background:#ecece8;color:#111}
.app-rail-more{font-size:16px;letter-spacing:1px;padding:6px 2px}
.app-rail-foot{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px}
.app-rail-pts{font-size:10px;color:#666;font-weight:600}
.app-rail-up{width:100%;border:none;background:#111;color:#fff;border-radius:8px;font-size:10px;padding:6px 4px;cursor:pointer;font-family:inherit;line-height:1.25}
.app-rail-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#c9a227,#a16207)}
.page{flex:1;min-width:0;min-height:0;display:flex;overflow:hidden}

.detail-left{width:320px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.left-back{display:block;padding:8px 14px 2px;font-size:12px;color:var(--muted);text-decoration:none;flex-shrink:0}
.left-back:hover{color:var(--agent)}
.left-id{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;flex-shrink:0}
.left-av{width:32px;height:32px;border-radius:50%;background:#e8e8e4;color:#111;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.left-id-main{flex:1;min-width:0}
.left-name{font-size:15px;font-weight:700;line-height:1.25;word-break:break-word}
.left-type{font-size:11px;color:var(--muted);margin-top:1px}
.left-fields{display:flex;flex-direction:column;justify-content:space-evenly;gap:0;padding:0 14px;flex:1;min-height:0;overflow:hidden}
.sys-box{flex-shrink:0;margin:6px 14px 8px;padding:8px 10px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--muted);line-height:1.5}
.sys-title{font-size:11px;font-weight:700;color:var(--text);margin-bottom:4px}
.sys-row{display:flex;gap:8px;align-items:flex-start}
.sys-row span{flex-shrink:0;width:52px;color:#94a3b8}
.weak-link{font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;padding:0;margin:0 14px 12px;align-self:flex-start;flex-shrink:0}
.weak-link:hover{color:var(--agent);text-decoration:underline}

.detail-right{flex:1;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 20px 40px}
.detail-right > *{margin-bottom:12px}
.detail-right > *:last-child{margin-bottom:0}
.mod{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.mod-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.mod.collapsible .mod-head{cursor:pointer;user-select:none}
.mod.collapsible .mod-head:hover{background:#fafbfc}
.mod.collapsed .mod-head{border-bottom:none}
.mod.collapsed .mod-body{display:none}
.mod-head h3{font-size:14px;font-weight:700}
.mod-head span,.mod-link{font-size:12px;color:var(--muted);font-weight:500}
.mod-toggle{font-size:12px;color:var(--agent);font-weight:600}
.mod-link{border:none;background:none;cursor:pointer;font-family:inherit;color:var(--agent);font-weight:600}
.mod-body{padding:14px 16px}

.hero-badges{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;align-items:center}
.tag{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;border:1px solid var(--border);background:var(--bg);color:var(--muted);flex-shrink:0}
.tag-status{color:#92400e;background:var(--gold-bg);border-color:rgba(201,162,39,.3)}
.tag-source{color:var(--accent);background:rgba(8,145,178,.08);border-color:rgba(8,145,178,.2)}
.tag-type{color:#1d4ed8;background:#dbeafe;border-color:#93c5fd}
.tag-country{color:#0f766e;background:#ccfbf1;border-color:#5eead4}
.tag-src-agent{color:#92400e;background:var(--gold-bg);border-color:rgba(201,162,39,.3)}

.tabs,.tab,.content,.overview-wrap,.content-padded{display:none}

.ai-strategy{padding:14px 16px;background:linear-gradient(135deg,#fdfaf5 0%,#fff 60%);border:1px solid rgba(245,166,35,.18);border-radius:12px}
.ai-strategy-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ai-strategy-icon{font-size:14px;font-weight:800;color:#f5a623;font-style:italic}
.ai-strategy-title{font-size:14px;font-weight:700;color:#f5a623}
.ai-strategy-line{font-size:13px;line-height:1.65;color:#334155;margin-bottom:4px}
.ai-strategy-line strong{margin-right:6px}
.ai-strategy-line em{font-style:normal;color:var(--muted);margin-right:4px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.kpi-card dt{font-size:10px;color:var(--muted);margin-bottom:4px}
.kpi-card dd{font-size:14px;font-weight:700;line-height:1.3}
.kpi-card dd small{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:2px}
.kpi-card dd a{color:var(--agent);text-decoration:none;font-size:13px}
.kpi-card.highlight{border-color:rgba(245,166,35,.35);background:linear-gradient(135deg,rgba(245,166,35,.06),var(--card))}
.overview-main{display:block}
.overview-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-height:0}
.overview-card.ov-follow .follow-box{border:none;border-radius:0}
.overview-card-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:#fafbfc}
.overview-card-head h3{font-size:12px;font-weight:600}
.overview-card-body{padding:12px 14px;font-size:12px;line-height:1.6}
.trade-mini-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.trade-mini-row:last-child{border-bottom:none}
.trade-mini-row span{color:var(--muted)}
.recent-link{font-size:11px;color:var(--agent);cursor:pointer;background:none;border:none;font-family:inherit;font-weight:600}
.recent-item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.recent-item:last-child{border-bottom:none;padding-bottom:0}
.recent-title{font-size:13px;font-weight:600;line-height:1.45;color:var(--text)}
.recent-item time{font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0;padding-top:2px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}}

.follow-box{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
.follow-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px;background:#fff}
.follow-head h3{font-size:14px;font-weight:600}
.follow-input{display:block;width:100%;min-height:88px;padding:12px 14px;border:none;border-top:1px solid var(--border);font-size:13px;font-family:inherit;resize:vertical;outline:none;background:#fff;color:var(--text)}
.follow-files{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;background:#fff}
.follow-files:empty{display:none}
.follow-file-chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:4px 8px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12px;color:var(--text);line-height:1.3}
.follow-file-chip svg{width:13px;height:13px;flex-shrink:0;color:#64748b}
.follow-file-chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.follow-file-chip button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 0 0 2px;font-family:inherit}
.follow-file-chip button:hover{color:#b91c1c}
.follow-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--border);background:#fff}
.follow-time-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.follow-time-wrap label{font-size:13px;font-weight:650;color:var(--text);white-space:nowrap}
.follow-time-wrap input{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none}
.follow-time-wrap input:focus{border-color:rgba(201,162,39,.45)}
.follow-attach{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border:none;background:none;color:#475569;cursor:pointer;border-radius:8px;flex-shrink:0}
.follow-attach svg{width:18px;height:18px}
.follow-attach:hover{color:#92400e;background:rgba(201,162,39,.08)}
.follow-attach.has-files{color:#92400e}
.btn{padding:7px 18px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--gold);color:#fff}

.co-field{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:2px 0;min-width:0;cursor:text;background:transparent;border:none;border-radius:0;flex:1 1 0}
.co-field dt{font-size:11px;color:var(--muted);font-weight:500;margin:0;line-height:1.3;flex:none}
.co-field dd{font-size:12px;font-weight:500;height:28px;line-height:20px;word-break:break-word;color:var(--text);padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:#fafbfc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.co-field.prose dd{font-weight:500;color:#334155;white-space:nowrap;display:block;-webkit-line-clamp:unset}
.co-field dd.ph{color:#94a3b8;font-weight:400}
.co-field:hover dd{border-color:rgba(201,162,39,.4)}
.co-link{color:var(--agent);text-decoration:none;font-weight:600}
.co-link:hover{text-decoration:underline}
.co-field[data-editing="1"]{background:transparent;border:none;padding:2px 0;box-shadow:none}
.co-field[data-editing="1"] dd,.co-field[data-editing="1"]:hover dd{color:var(--text);white-space:normal;height:auto;overflow:auto}
.co-field[data-editing="1"] .inline-input{width:100%;height:28px;border:1px solid rgba(201,162,39,.45);border-radius:6px;background:#fffef8;font:inherit;font-size:12px;font-weight:500;padding:4px 8px;outline:none;resize:none;font-family:inherit;box-sizing:border-box}
.co-field textarea.inline-input{height:28px;min-height:28px;max-height:28px;line-height:20px}

.pcard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:stretch;width:100%}
.pcard{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:0;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.pcard:hover{border-color:rgba(124,58,237,.28);box-shadow:0 2px 10px rgba(15,23,42,.05)}
@media(max-width:1100px){.pcard-grid{grid-template-columns:1fr}}
.pcard-h{display:flex;align-items:center;gap:8px;min-width:0}
.pcard-av{width:28px;height:28px;border-radius:50%;background:#e0e7ff;color:#4338ca;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.pcard-h-main{flex:1;min-width:0;overflow:hidden}
.pcard-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.pcard-name-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-role{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
.pcard-ico{width:28px;height:28px;border:none;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0}
.pcard-ico svg{width:15px;height:15px}
.pcard-ico.mail{background:#f1f5f9;color:#64748b}
.pcard-ico.mail:hover{background:#e2e8f0;color:#334155}
.pcard-ico.wa{background:#dcfce7;color:#16a34a}
.pcard-ico.wa:hover{background:#bbf7d0;color:#15803d}
.pcard-reach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 8px;min-width:0}
.pcard-kv{min-width:0;overflow:hidden}
.pcard-kv dt{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:2px}
.pcard-kv dd{font-size:11px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-notes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;min-width:0}
.pcard-notes:has(.pcard-note:only-child){grid-template-columns:minmax(0,1fr)}
.pcard-note{font-size:11px;line-height:1.4;color:#334155;background:#fff;border-left:3px solid #94a3b8;padding:5px 8px;border-radius:0 6px 6px 0;display:flex;align-items:baseline;gap:6px;min-width:0;overflow:hidden}
.pcard-note b{font-size:10px;color:var(--muted);flex-shrink:0;white-space:nowrap}
.pcard-note span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-note.suggest{background:#f0fdf4;border-left-color:#16a34a}
.badge-primary{font-size:10px;padding:2px 6px;border-radius:999px;background:var(--gold-bg);color:#92400e;flex-shrink:0;white-space:nowrap}
.email-line{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden}
.email-addr{font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.email-type{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.email-type.corp{color:#0369a1;background:rgba(3,105,161,.06)}
.social-cell{display:flex;gap:4px}
.social-icon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-decoration:none}
.social-icon.li{background:#0a66c2}.social-icon.fb{background:#1877f2}.social-icon.tw{background:#1da1f2}

.feed-timeline{position:relative;padding-left:36px}
.feed-timeline::before{content:'';position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--border)}
.feed-item{position:relative;margin-bottom:14px}
.feed-item:last-child{margin-bottom:0}
.feed-icon{position:absolute;left:-36px;top:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.feed-icon.follow{background:var(--orange-bg);color:var(--orange)}
.feed-icon.system{background:var(--agent-bg);color:var(--agent)}
.feed-icon.chat{background:var(--green-bg);color:var(--green)}
.feed-head{margin-bottom:6px;font-size:13px;font-weight:600;line-height:1.4}
.feed-head span{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.feed-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.feed-file{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:12px;color:var(--text)}
.feed-file svg{width:12px;height:12px;color:#64748b}
.change-table{width:100%;border-collapse:collapse;font-size:12px}
.change-table th,.change-table td{padding:6px 10px;border:1px solid var(--border);text-align:left}
.chat-bubble{max-width:75%;padding:8px 12px;border-radius:10px;font-size:13px;margin-bottom:8px}
.chat-bubble.in{background:#f5f0e6;border-radius:10px 10px 10px 2px}
.chat-bubble.out{background:var(--gold);color:#fff;margin-left:auto}

.trade-scroll{overflow-x:auto}
.trade-table{width:100%;border-collapse:collapse;font-size:12px}
.trade-table th{text-align:left;padding:8px 12px;background:var(--bg);color:var(--muted);font-weight:600;font-size:11px;border-bottom:1px solid var(--border)}
.trade-table td{padding:9px 12px;border-bottom:1px solid var(--border)}
.trade-table tr:last-child td{border-bottom:none}
.trade-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.lead-trade-section{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.lead-trade-section-title{font-size:13px;font-weight:700;margin-bottom:10px}
.lead-overview-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lead-overview-card{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:0}
.lead-overview-card dt{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:6px}
.lead-overview-card dd{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.3;word-break:break-word}
.lead-trade-all{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:12px;font-weight:600}
@media(max-width:900px){.lead-overview-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.empty-inline{font-size:13px;color:var(--muted);padding:8px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;z-index:200}
.toast.show{opacity:1}
.panel{background:transparent;border:none;border-radius:0;padding:0}
.gap-note{font-size:12px;line-height:1.65;color:#92400e;background:var(--gold-bg);border:1px solid rgba(201,162,39,.28);border-radius:10px;padding:10px 12px}
.gap-note b{display:block;margin-bottom:2px}
.contacts-toolbar{display:none}

.cdrawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:180;opacity:0;pointer-events:none;transition:opacity .22s}
.cdrawer-mask.show{opacity:1;pointer-events:auto}
.cdrawer{position:fixed;top:0;right:0;width:440px;max-width:100%;height:100vh;background:#fff;border-left:1px solid var(--border);box-shadow:-12px 0 40px rgba(15,23,42,.12);z-index:181;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease}
.cdrawer.show{transform:translateX(0)}
.cdrawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.cdrawer-head h3{font-size:16px;font-weight:700}
.cdrawer-kicker{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.cdrawer-close{border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:4px}
.cdrawer-close:hover{color:var(--text)}
.cdrawer-body{flex:1;overflow-y:auto;padding:16px 18px 24px}
.cdrawer-name-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px}
.cdrawer-av{width:40px;height:40px;border-radius:50%;background:#e0e7ff;color:#4338ca;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.cdrawer-id{min-width:0;flex:1}
.cdrawer-name{font-size:20px;font-weight:700;letter-spacing:-.03em;margin:0}
.cdrawer-co{font-size:13px;color:var(--muted);margin-top:4px;font-weight:500}
.pf-grid{display:flex;flex-direction:column;gap:0}

function dashVal(v){const s=String(v||'').trim();return (!s||s==='—')?'':s}

const SOCIAL_PLATFORMS=['LinkedIn','Facebook','Twitter','Instagram','YouTube','TikTok','其他'];
const DIAL_CODES=[{code:'+1',name:'美国'},{code:'+86',name:'中国'},{code:'+44',name:'英国'},{code:'+49',name:'德国'},{code:'+55',name:'巴西'},{code:'+81',name:'日本'},{code:'+46',name:'瑞典'},{code:'+33',name:'法国'},{code:'+61',name:'澳大利亚'},{code:'+82',name:'韩国'},{code:'+971',name:'阿联酋'}];
function dialOptions(selected){
  return `<option value="">请选择</option>`+DIAL_CODES.map(d=>`<option value="${d.code}" ${selected===d.code?'selected':''}>${d.code}${d.name}</option>`).join('');
}
function parseDial(raw){
  const s=String(raw||'').trim();
  const sorted=[...DIAL_CODES].sort((a,b)=>b.code.length-a.code.length);
  for(const d of sorted){ if(s.startsWith(d.code)) return {code:d.code, number:s.slice(d.code.length).replace(/^[\s-]+/,'')}; }
  const m=s.match(/^(\+\d{1,4})\s*(.*)$/);
  if(m) return {code:m[1], number:m[2]};
  return {code:'', number:s};
}
function joinDial(code,number){return [code, String(number||'').trim()].filter(Boolean).join(' ').trim()}
function ensurePerson(p){
  if(!p.was) p.was=dashVal(p.wa)?[p.wa]:[''];
  if(!p.was.length) p.was=[''];
  if(!p.phones) p.phones=dashVal(p.phone)?[p.phone]:[''];
  if(!p.phones.length) p.phones=[''];
  if(!p.emails) p.emails=[];
  if(!p.emails.length && dashVal(p.email)) p.emails=[{address:p.email,type:'corporate',status:'verified'}];
  if(!p.emails.length) p.emails=[{address:'',type:'corporate',status:'verified'}];
  if(!p.socials){
    p.socials=[];
    if(dashVal(p.linkedin)) p.socials.push({platform:'LinkedIn',url:p.linkedin});
    else if(p.social?.linkedin) p.socials.push({platform:'LinkedIn',url:''});
    if(p.social?.facebook && !p.socials.some(s=>s.platform==='Facebook')) p.socials.push({platform:'Facebook',url:''});
    if(p.social?.twitter) p.socials.push({platform:'Twitter',url:''});
  }
  if(!p.socials.length) p.socials=[{platform:'',url:''}];
  return p;
}
function emailList(p){return (p.emails||[]).map(e=>typeof e==='string'?e:(e.address||''))}

      ${SOCIAL_PLATFORMS.map(pl=>`<option value="${pl}" ${s.platform===pl?'selected':''}>${pl}</option>`).join('')}
    </select>
    <input class="mv-body" value="${escHtml(s.url||'')}" placeholder="主页链接" ${s.platform?'':'disabled'} onblur="setSocialUrl(${i},this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">
  </div>`).join('');
  return `<div class="pf-field mv">
    <div class="mv-head"><span class="mv-label">社媒</span><button class="mv-plus" type="button" onclick="addSocial()">+</button></div>
    <div class="mv-rows">${rows}</div>
  </div>`;
}
function pfFieldHTML(key,label,value,opts){
  const v=dashVal(value), empty=!v, multi=opts?.multi?'1':'0';
  return `<div class="pf-field" data-key="${key}" data-label="${label}" data-multi="${multi}" onmouseenter="beginPfEdit(this)">
    <dt>${label}</dt><dd class="${empty?'ph':''}">${empty?'—':escHtml(v)}</dd></div>`;
}
function maskedFieldHTML(label){
  return `<div class="pf-field"><dt>${label}</dt><dd>${MASK}</dd></div>`;
}
function contactDrawerHTML(p){
  ensurePerson(p);
  const co=c.name||p.companyName||'';
  const locked=quotaLockedPerson(p);
  const fields=locked
    ? `${maskedFieldHTML('WhatsApp')}${maskedFieldHTML('邮箱')}${maskedFieldHTML('手机')}${maskedFieldHTML('社媒')}${pfFieldHTML('role','职位',p.role)}${maskedFieldHTML('备注')}`
    : `${mvFieldHTML('wa','WhatsApp',p.was,'dial')}
        ${mvFieldHTML('email','邮箱',emailList(p),'plain')}
        ${mvFieldHTML('phone','手机',p.phones,'dial')}
        ${socialFieldHTML(p)}
        ${pfFieldHTML('role','职位',p.role)}
        ${pfFieldHTML('notes','备注',p.notes||p.preference,{multi:true})}`;
  return `<div class="cdrawer-head"><h3>联系人档案</h3><button class="cdrawer-close" type="button" onclick="closeContactDrawer()">×</button></div>
    <div class="cdrawer-body">
      <div class="cdrawer-name-row">
        <div class="cdrawer-av">${initialsOf(p.name)}</div>
        <div class="cdrawer-id">
          <div class="cdrawer-name">${escHtml(p.name||'—')}</div>
          ${co?`<div class="cdrawer-co">${escHtml(co)}</div>`:''}
        </div>
      </div>
      <div class="pf-grid">${fields}</div>
    </div>`;
}
let drawerPerson=null;
function refreshDrawer(){
  if(!drawerPerson) return;
  document.getElementById('cdrawer').innerHTML=contactDrawerHTML(drawerPerson);
}
function addMv(key){
  if(!drawerPerson||quotaLockedPerson(drawerPerson)) return;
  if(key==='email'){ if(!drawerPerson.emails) drawerPerson.emails=[]; drawerPerson.emails.push({address:'',type:'corporate',status:'verified'}); }
  else if(key==='wa'){ if(!drawerPerson.was) drawerPerson.was=[]; drawerPerson.was.push(''); }
  else if(key==='phone'){ if(!drawerPerson.phones) drawerPerson.phones=[]; drawerPerson.phones.push(''); }
  refreshDrawer();
}
function removeMv(key,i){
  if(!drawerPerson) return;
  if(key==='email') drawerPerson.emails.splice(i,1);
  else if(key==='wa') drawerPerson.was.splice(i,1);
  else if(key==='phone') drawerPerson.phones.splice(i,1);
  toast('已保存');
  refreshDrawer();
}
function commitDial(key,i,code,number){
  if(!drawerPerson) return;
  const next=joinDial(code,number);
  if(key==='wa'){
    if(!drawerPerson.was) drawerPerson.was=[];
    drawerPerson.was[i]=next;
    drawerPerson.wa=drawerPerson.was.find(dashVal)||'';
  }else if(key==='phone'){
    if(!drawerPerson.phones) drawerPerson.phones=[];
    drawerPerson.phones[i]=next;
    drawerPerson.phone=drawerPerson.phones.find(dashVal)||'';
  }
}
function commitMv(key,i,value){
  if(!drawerPerson) return;
  const next=String(value||'').trim();
  if(key==='email'){
    if(!drawerPerson.emails) drawerPerson.emails=[];
    if(!drawerPerson.emails[i]) drawerPerson.emails[i]={type:'corporate',status:'verified'};
    drawerPerson.emails[i].address=next;
    drawerPerson.email=drawerPerson.emails.map(e=>typeof e==='string'?e:e.address).find(dashVal)||'';
  }else if(key==='wa'){
    if(!drawerPerson.was) drawerPerson.was=[];
    drawerPerson.was[i]=next;
    drawerPerson.wa=drawerPerson.was.find(dashVal)||'';
  }else if(key==='phone'){
    if(!drawerPerson.phones) drawerPerson.phones=[];
    drawerPerson.phones[i]=next;
    drawerPerson.phone=drawerPerson.phones.find(dashVal)||'';
  }
}
function addSocial(){
  if(!drawerPerson||quotaLockedPerson(drawerPerson)) return;
  if(!drawerPerson.socials) drawerPerson.socials=[];
  drawerPerson.socials.push({platform:'',url:''});
  refreshDrawer();
}
function removeSocial(i){
  drawerPerson?.socials?.splice(i,1);
  toast('已保存');
  refreshDrawer();
}
function setSocialPlatform(i,platform){
  if(!drawerPerson?.socials?.[i]) return;
  drawerPerson.socials[i].platform=platform;
  refreshDrawer();
}
function setSocialUrl(i,url){
  if(!drawerPerson?.socials?.[i]) return;
  drawerPerson.socials[i].url=String(url||'').trim();
  const li=drawerPerson.socials.find(s=>s.platform==='LinkedIn');
  drawerPerson.linkedin=li?.url||'';
  toast('已保存');
}
function beginPfEdit(el){
  if(el.dataset.editing==='1'||!drawerPerson||quotaLockedPerson(drawerPerson)) return;
  document.querySelectorAll('.pf-field[data-editing="1"]').forEach(o=>{if(o!==el)o.querySelector('.inline-input')?.blur()});
  const key=el.dataset.key, multi=el.dataset.multi==='1';
  const val=key==='notes'?(drawerPerson.notes||drawerPerson.preference||''):(drawerPerson[key]||'');
  el.dataset.editing='1';
  el.innerHTML=multi
    ? `<dt>${el.dataset.label}</dt><textarea class="inline-input" onblur="commitPfEdit(this)">${escHtml(val)}</textarea>`
    : `<dt>${el.dataset.label}</dt><input class="inline-input" value="${escHtml(val)}" onblur="commitPfEdit(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">`;
  el.querySelector('.inline-input').focus();
}
function commitPfEdit(inp){
  const el=inp.closest('.pf-field'); if(!el||!drawerPerson) return;
  const key=el.dataset.key, next=inp.value.trim();
  const prev=(key==='notes'?(drawerPerson.notes||''):(drawerPerson[key]||'')).trim();
  drawerPerson[key]=next;
  el.dataset.editing='0';
  const empty=!next;
  el.innerHTML=`<dt>${el.dataset.label}</dt><dd class="${empty?'ph':''}">${empty?'—':escHtml(next)}</dd>`;
  if(next!==prev) toast('已保存');
}
function openContactDrawer(i){
  if(quotaLockedCurrent()){ quotaLimitToast(); return; }
  const p=c.contacts?.[i]; if(!p) return;
  drawerPerson=ensurePerson(p);
  const el=document.getElementById('cdrawer');
  el.innerHTML=contactDrawerHTML(p);
  el.classList.add('show');
  document.getElementById('cdrawer-mask').classList.add('show');
}
function closeContactDrawer(){
  document.querySelectorAll('.pf-field[data-editing="1"] .inline-input').forEach(inp=>inp.blur());
  document.getElementById('cdrawer')?.classList.remove('show');
  document.getElementById('cdrawer-mask')?.classList.remove('show');
  const box=document.getElementById('detail-right'); const top=box?.scrollTop||0;
  renderRight();
  if(box) box.scrollTop=top;
}
function openWaChat(phone,name){
  if(quotaLockedCurrent()){ quotaLimitToast(); return; }
  const hasChat=(c.activities||[]).some(a=>a.type==='chat'&&a.contact===name);
  if(hasChat){
    if(!timelineOpen) toggleMod('timeline');
    document.getElementById('mod-timeline')?.scrollIntoView({behavior:'smooth',block:'start'});
    toast('已打开与 '+(name||'联系人')+' 的对话');
    setTimeout(()=>{
      const item=[...document.querySelectorAll('.feed-item')].find(el=>el.textContent.includes(name||'')&&el.textContent.includes('私信'));
      item?.scrollIntoView({behavior:'smooth',block:'center'});
    },60);
    return;
  }
  const digits=String(phone||'').replace(/\D/g,'');
  if(digits) window.open('https://wa.me/'+digits,'_blank','noopener');
  else toast('暂无 WhatsApp 对话');
}
function toast(msg){
  let t=document.querySelector('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}
  t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);
}
if(isEnt){
  renderLeft();
  renderRight();
  if(qs.get('follow')==='1') setTimeout(()=>document.getElementById('follow-slot')?.scrollIntoView({behavior:'smooth',block:'center'}),40);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeContactDrawer()});
function startCrmTourFromDetail(){
  location.href='crm-v2.html?tour=1';
}
function startDetailTour(force){
  if(!window.TradeOnboarding) return;
  const steps=[
    {kicker:'客户管理', sel:'#tour-stage', title:'客户阶段', body:'从待联系到成交，客户全生命周期跟进不遗漏。', radius:'999px'},
    {kicker:'客户管理', sel:'#tour-ai-strategy', title:'AI策略', body:'AI精准识别客户痛点，并推荐定制化行动策略。'},
    {kicker:'客户管理', sel:'#mod-contacts', title:'联系人', body:'汇集公司全部联系人，查看 WhatsApp、邮箱和电话，一键触达'},
    {kicker:'客户管理', sel:'#follow-slot', title:'写跟进', body:'每次沟通记一笔，助力成交转化。', doneLabel:'完成'}
  ].filter(function(s){return !s.sel||s.before||document.querySelector(s.sel);});
  TradeOnboarding.start(steps,{storageKey:'crm',force:!!force,offset:1,total:5});
}
if(isEnt){
  setTimeout(function(){ if(qs.get('tour')==='1') startDetailTour(true); },500);
}
</script>
</body>
</html>
