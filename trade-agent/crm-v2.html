<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeLink · 客户管理</title>
<style>
:root {
  --bg:#f4f6f9; --card:#fff; --text:#0f172a; --muted:#64748b;
  --border:#e8ecf1; --sidebar:#0f172a;
  --gold:#c9a227; --gold-bg:rgba(201,162,39,.1);
  --agent:#7c3aed; --agent-bg:rgba(124,58,237,.08);
  --accent:#0891b2; --accent-bg:rgba(8,145,178,.08);
  --hot:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
.app-rail{width:76px;background:#f4f4f2;border-right:1px solid #e8e8e4;display:flex;flex-direction:column;align-items:center;padding:10px 6px 12px;flex-shrink:0;height:100vh;position:sticky;top:0;z-index:20}
.app-rail-logo{width:34px;height:34px;border-radius:50%;background:#111;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:6px;letter-spacing:.02em}
.app-rail-new{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:6px 0 10px;border:none;background:none;cursor:pointer;color:#111;font-size:11px;font-family:inherit;font-weight:500}
.app-rail-new .plus{width:26px;height:26px;border-radius:7px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.app-rail-nav{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.app-rail-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;border-radius:10px;text-decoration:none;color:#555;font-size:10px;line-height:1.2;text-align:center;font-weight:500}
.app-rail-item svg{width:20px;height:20px}
.app-rail-item.active{color:#111;background:#ecece8;font-weight:600}
.app-rail-item:hover{background:#ecece8;color:#111}
.app-rail-more{font-size:16px;letter-spacing:1px;padding:6px 2px}
.app-rail-foot{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px}
.app-rail-pts{font-size:10px;color:#666;font-weight:600}
.app-rail-up{width:100%;border:none;background:#111;color:#fff;border-radius:8px;font-size:10px;padding:6px 4px;cursor:pointer;font-family:inherit;line-height:1.25}
.app-rail-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#c9a227,#a16207)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}

.btn{padding:8px 14px;border-radius:9px;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.btn-gold{background:var(--gold);color:#fff}
.btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:rgba(201,162,39,.4);color:#92400e}

.toolbar{padding:10px 20px;background:var(--card);border-bottom:0;display:flex;align-items:center;gap:10px;flex-shrink:0}
.filter-grid{flex:1;min-width:0;display:grid;gap:10px;grid-template-columns:repeat(5,minmax(0,1fr))}
.filter-item{min-width:0;display:flex;flex-direction:row;align-items:center;gap:8px}
.filter-item[hidden]{display:none}
.filter-item label{flex-shrink:0;font-size:12px;color:var(--text);font-weight:500;line-height:1;white-space:nowrap}
.kw-input,.mini-sel{flex:1;width:100%;min-width:0;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);outline:none;color:var(--text);box-sizing:border-box}
.kw-input:focus,.mini-sel:focus{border-color:rgba(201,162,39,.45);background:#fff}
.kw-input::placeholder{color:var(--muted)}
.filter-actions{display:flex;gap:8px;flex-shrink:0;align-items:center}
.filter-actions .btn{height:34px;padding:0 16px}

@media(max-width:900px){
  .toolbar{flex-wrap:wrap}
  .filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filter-actions{width:100%;justify-content:flex-end}
}

.list-area{flex:1;overflow-y:auto;padding:12px 20px 16px}
.page-foot{margin-top:16px;padding:14px 4px 8px;border-top:1px solid var(--border);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.weak-link{font-size:12px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.weak-link:hover{color:var(--agent);text-decoration:underline}
.list-head{display:grid;gap:8px;padding:8px 16px 10px;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em;position:sticky;top:0;background:var(--bg);z-index:2}
.list-head,.crow.ent{grid-template-columns:minmax(140px,1.4fr) minmax(56px,.7fr) minmax(128px,1.3fr) minmax(72px,.8fr) minmax(96px,1fr) minmax(128px,1.3fr) minmax(72px,.8fr) minmax(96px,.95fr) 108px}

.crow{display:grid;gap:8px;align-items:center;padding:16px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;min-height:72px;cursor:pointer;transition:.12s;font-size:12px}
.crow > div{min-width:0;overflow:hidden}
.crow > .ent-people,.crow > .crow-ops{overflow:visible}
.crow-ops{display:flex;flex-direction:row;align-items:center;gap:6px;flex-wrap:nowrap}
.op-link{height:26px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;line-height:24px;white-space:nowrap}
.op-follow{color:#92400e;background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.35)}
.op-follow:hover{background:rgba(201,162,39,.2);border-color:rgba(201,162,39,.55)}
.op-edit{color:#475569;background:#fff;border:1px solid var(--border)}
.op-edit:hover{color:var(--text);border-color:#cbd5e1;background:#f8fafc}
.crow:hover{border-color:rgba(124,58,237,.22);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.crow-name{font-size:13px;font-weight:400;line-height:1.35;color:var(--agent)}
.crow-name:hover{text-decoration:underline}
.crow-sub{font-size:11px;color:var(--muted);margin-top:1px}
.company-link{color:var(--agent);font-weight:400;text-decoration:none}
.company-link:hover{text-decoration:underline}
.reach{font-size:11px;line-height:1.5;color:var(--text)}
.reach-row{display:flex;align-items:center;gap:4px;min-width:0}
.reach-row b{color:var(--muted);font-weight:600;flex-shrink:0;width:28px}
.reach-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reach-copy{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:11px;padding:0 2px;font-family:inherit}
.reach-copy:hover{color:var(--agent)}
.reach-mail{border:none;background:var(--agent-bg);color:var(--agent);font-size:10px;font-weight:600;border-radius:6px;padding:1px 6px;cursor:pointer;font-family:inherit;flex-shrink:0}
.tag-stage{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--gold-bg);color:#92400e;border:1px solid rgba(201,162,39,.25);font-weight:600;display:inline-block}
.tag-src{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--border);display:inline-block}
.interaction-text{color:var(--text);line-height:1.4;font-size:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.interaction-time{font-size:11px;color:var(--muted);line-height:1.35;word-break:break-all}
.interaction-cell{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.interaction-cell .interaction-text{-webkit-line-clamp:2}
.btn-reply{display:inline-flex;align-items:center;height:auto;padding:2px 8px;border-radius:999px;background:rgba(201,162,39,.1);color:#a16207;border:1px solid rgba(201,162,39,.28);font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;line-height:1.3}
.btn-reply:hover{background:rgba(201,162,39,.18);border-color:rgba(201,162,39,.45)}
.ent-people{position:relative;min-width:0}
.ent-people-main{display:flex;align-items:center;gap:6px;min-width:0}
.ent-people-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-icos{display:inline-flex;align-items:center;gap:3px;flex-shrink:0}
.ch-ico{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;color:#64748b}
.ch-ico svg{width:13px;height:13px}
.ch-ico.wa{color:#16a34a}
.ch-ico.mail{color:#64748b}
.ch-ico.phone{color:#64748b}
.soc-ico{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;font-size:9px;font-weight:800;line-height:1;flex-shrink:0}
.soc-ico.li{background:#0a66c2;color:#fff;font-size:8px}
.soc-ico.fb{background:#1877f2;color:#fff}
.soc-ico.tw{background:#111;color:#fff;font-size:8px}
#people-tip{position:fixed;z-index:220;display:none;width:320px;background:#fff;border:1px solid #e8ecf1;border-radius:14px;box-shadow:0 18px 48px rgba(15,23,42,.16),0 0 0 1px rgba(15,23,42,.03);padding:0;max-height:min(420px,72vh);overflow:auto}
#people-tip.show{display:block}
.people-tip-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.people-tip-head em{font-style:normal;color:var(--text);font-weight:700}
.people-tip-person{padding:12px 14px;cursor:pointer}
.people-tip-person:hover{background:#f8fafc}
.people-tip-person + .people-tip-person{border-top:1px solid #f1f5f9}
.people-tip-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-width:0}
.people-tip-name{font-size:13px;font-weight:650;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.people-tip-role{margin-left:auto;flex-shrink:0;font-size:10px;font-weight:600;color:#92400e;background:var(--gold-bg);border-radius:999px;padding:2px 8px}
.people-tip-flag{flex-shrink:0;font-size:10px;color:var(--agent);background:var(--agent-bg);border-radius:999px;padding:2px 6px;font-weight:600}
.people-tip-channels{display:flex;flex-direction:column;gap:0;background:#f8fafc;border-radius:8px;padding:2px 0;overflow:hidden}
.people-tip-row{display:grid;grid-template-columns:68px 1fr;align-items:center;gap:8px;padding:6px 10px;font-size:12px;color:#334155;min-width:0}
.people-tip-row + .people-tip-row{border-top:1px solid #eef2f6}
.people-tip-ch{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.people-tip-row.wa .people-tip-ch{color:#16a34a}
.people-tip-val{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.people-tip-empty{font-size:12px;color:var(--muted);padding:14px}
.contact-info{font-size:11px;color:var(--text);line-height:1.45;display:flex;flex-direction:column;gap:3px;min-width:0}
.ci-row{display:flex;align-items:center;gap:6px;min-width:0}
.ci-row svg{width:13px;height:13px;flex-shrink:0}
.ci-row.mail svg{color:#64748b}
.ci-row.phone svg{color:#64748b}
.ci-row.wa svg{color:#16a34a}
.ci-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-cell{font-size:11px;color:#334155;line-height:1.45;padding:5px 8px;background:linear-gradient(135deg,rgba(245,166,35,.06),rgba(124,58,237,.04));border-left:2px solid var(--gold);border-radius:0 6px 6px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ai-cell strong{color:#c2410c;font-weight:600;font-size:10px}
.tag-src.agent{color:#92400e;background:var(--gold-bg);border-color:rgba(201,162,39,.25)}

.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px;background:var(--card);border:1px dashed var(--border);border-radius:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;z-index:200}
.toast.show{opacity:1}

.list-follow-mask{position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:190;display:none;align-items:center;justify-content:center}
.list-follow-mask.show{display:flex}
.list-follow-dialog{width:420px;max-width:calc(100% - 32px);background:#fff;border-radius:12px;border:1px solid var(--border);box-shadow:0 16px 40px rgba(15,23,42,.16);padding:16px 18px}
.list-follow-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.list-follow-h h3{font-size:15px;font-weight:700}
.list-follow-sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.list-follow-dialog textarea{width:100%;min-height:96px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit;font-size:13px;outline:none;resize:vertical;box-sizing:border-box}
.list-follow-dialog textarea:focus{border-color:rgba(201,162,39,.45)}
.list-follow-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

.archive-mask{position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:190;display:none;align-items:center;justify-content:center;padding:20px}
.archive-mask.show{display:flex}
.archive-dialog{width:640px;max-width:100%;max-height:90vh;background:#fff;border-radius:14px;border:1px solid var(--border);box-shadow:0 20px 60px rgba(15,23,42,.16);display:flex;flex-direction:column}
.archive-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.archive-h h3{font-size:16px;font-weight:700}
.archive-body{padding:16px 20px;overflow-y:auto;flex:1}
.archive-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.archive-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.archive-grid label.full{grid-column:1/-1}
.archive-grid input,.archive-grid textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);width:100%;outline:none}
.archive-grid input:focus,.archive-grid textarea:focus{border-color:rgba(201,162,39,.45);background:#fff}
.archive-grid textarea{min-height:72px;resize:vertical;line-height:1.5}
.archive-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}

.cdrawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:180;opacity:0;pointer-events:none;transition:opacity .22s}
.cdrawer-mask.show{opacity:1;pointer-events:auto}
.cdrawer{position:fixed;top:0;right:0;width:440px;max-width:100%;height:100vh;background:#fff;border-left:1px solid var(--border);box-shadow:-12px 0 40px rgba(15,23,42,.12);z-index:181;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease}
.cdrawer.show{transform:translateX(0)}
.cdrawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.cdrawer-head h3{font-size:16px;font-weight:700}
.cdrawer-kicker{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.cdrawer-close{border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:4px}
.cdrawer-close:hover{color:var(--text)}
.cdrawer-body{flex:1;overflow-y:auto;padding:16px 18px 24px}
.cdrawer-name-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px}
.cdrawer-av{width:40px;height:40px;border-radius:50%;background:#e0e7ff;color:#4338ca;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.cdrawer-id{min-width:0;flex:1}
.cdrawer-name{font-size:20px;font-weight:700;letter-spacing:-.03em;margin:0}
.cdrawer-co{font-size:13px;color:var(--muted);margin-top:4px;font-weight:500}
.pf-grid{display:flex;flex-direction:column;gap:0}
.pf-field{padding:14px 0;border-radius:0;cursor:text;border:none;border-bottom:1px solid var(--border)}
.pf-field:last-child{border-bottom:none;padding-bottom:0}
.pf-field dt,.mv-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.pf-field dd{font-size:13px;font-weight:500;min-height:22px;line-height:1.45;word-break:break-word;white-space:pre-wrap;color:var(--text)}
.pf-field dd.ph{color:#94a3b8;font-weight:400}
.pf-field:hover{background:transparent}
.pf-field[data-editing="1"]{background:#fffef8;border:1px solid rgba(201,162,39,.45);border-radius:8px;padding:8px 10px}
.pf-field .inline-input{width:100%;border:none;background:transparent;font:inherit;font-size:13px;font-weight:500;padding:0;outline:none;resize:vertical;font-family:inherit}
.pf-field textarea.inline-input{min-height:64px}
.pf-field.mv{cursor:default}
.mv-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.mv-label{margin-bottom:0}
.mv-plus{border:none;background:none;color:var(--muted);font-size:15px;line-height:1;cursor:pointer;font-family:inherit;font-weight:500;padding:0 2px;border-radius:4px}
.mv-plus:hover{color:var(--gold);background:transparent}
.mv-rows{display:flex;flex-direction:column;gap:8px}
.mv-combo{display:flex;align-items:center;border:none;border-radius:0;overflow:visible;background:transparent;min-height:22px}
.mv-prefix{border:none;border-right:none;padding:0 10px 0 0;margin-right:10px;font-size:13px;font-weight:500;background:transparent;color:var(--text);min-width:96px;max-width:140px;outline:none;font-family:inherit;appearance:auto;cursor:pointer}
.mv-body{flex:1;min-width:0;border:none;padding:0;font-size:13px;font-weight:500;outline:none;font-family:inherit;background:transparent;color:var(--text)}
.mv-del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 0 0 8px;flex-shrink:0}
.mv-del:hover{color:#b91c1c}

@media(max-width:1100px){
  .list-head{display:none}
  .crow{display:block;padding:14px}
  .crow-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;font-size:12px}
  .ai-cell{margin-top:8px}
}

function daysFromToday(iso) {
  if (!iso) return null;
  const d = String(iso).slice(0, 10);
  return Math.round((new Date(TODAY + 'T00:00:00') - new Date(d + 'T00:00:00')) / 86400000);
}
function interactLabel(iso) {
  const n = daysFromToday(iso);
  if (n == null) return '—';
  if (n <= 0) return '今天';
  if (n <= 1) return '1天前';
  if (n <= 3) return '3天前';
  if (n <= 7) return '7天前';
  if (n <= 15) return '15天前';
  return '超30天';
}
function matchDateFilter(iso, key) {
  if (!key) return true;
  const n = daysFromToday(iso);
  if (n == null) return false;
  if (key === 'today') return n === 0;
  if (key === 'yesterday') return n === 1;
  if (key === '7d') return n >= 0 && n <= 7;
  if (key === '30d') return n >= 0 && n <= 30;
  if (key === '90plus') return n >= 90;
  if (key === 'month') return String(iso).slice(0, 7) === TODAY.slice(0, 7);
  return true;
}

function getFilteredCustomerBase() {
  let list = [...ENTERPRISES];
  const { kw, source, owner, interact, created } = appliedFilters;
  if (source) list = list.filter(c => c.source === source);
  if (owner?.length) list = list.filter(c => owner.includes(ownerOf(c)));
  if (interact) list = list.filter(c => interactLabel(c.interactionAt) === interact);
  if (created) list = list.filter(c => matchDateFilter(c.createdAt, created));
  if (kw) {
    list = list.filter(c => {
      const people = contactsOf(c.id).map(p => [p.name, p.email, p.phone, p.wa, p.role].join(' ')).join(' ');
      const hay = [c.name, c.country, countryLabel(c.country), c.source, c.interaction, c.status, people]
        .filter(Boolean).join(' ').toLowerCase();
      return hay.includes(kw);
    });
  }
  return list;
}

function dashVal(v) {
  const s = String(v || '').trim();
  return !s || s === '—' ? '' : s;
}
function escHtml(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
const SOCIAL_PLATFORMS = ['LinkedIn','Facebook','Twitter','Instagram','YouTube','TikTok','其他'];
const DIAL_CODES=[{code:'+1',name:'美国'},{code:'+86',name:'中国'},{code:'+44',name:'英国'},{code:'+49',name:'德国'},{code:'+55',name:'巴西'},{code:'+81',name:'日本'},{code:'+46',name:'瑞典'},{code:'+33',name:'法国'},{code:'+61',name:'澳大利亚'},{code:'+82',name:'韩国'},{code:'+971',name:'阿联酋'}];
function dialOptions(selected){
  return `<option value="">请选择</option>`+DIAL_CODES.map(d=>`<option value="${d.code}" ${selected===d.code?'selected':''}>${d.code}${d.name}</option>`).join('');
}
function parseDial(raw){
  const s=String(raw||'').trim();
  const sorted=[...DIAL_CODES].sort((a,b)=>b.code.length-a.code.length);
  for(const d of sorted){ if(s.startsWith(d.code)) return {code:d.code, number:s.slice(d.code.length).replace(/^[\s-]+/,'')}; }
  const m=s.match(/^(\+\d{1,4})\s*(.*)$/);
  if(m) return {code:m[1], number:m[2]};
  return {code:'', number:s};
}
function joinDial(code,number){return [code, String(number||'').trim()].filter(Boolean).join(' ').trim()}
function ensurePerson(p) {
  if (!p.was) p.was = dashVal(p.wa) ? [p.wa] : [''];
  if (!p.was.length) p.was = [''];
  if (!p.phones) p.phones = dashVal(p.phone) ? [p.phone] : [''];
  if (!p.phones.length) p.phones = [''];
  if (!p.emails) p.emails = [];
  if (!p.emails.length && dashVal(p.email)) p.emails = [{address:p.email,type:'corporate',status:'verified'}];
  if (!p.emails.length) p.emails = [{address:'',type:'corporate',status:'verified'}];
  if (!p.socials) {
    p.socials = [];
    if (dashVal(p.linkedin)) p.socials.push({platform:'LinkedIn', url:p.linkedin});
    else if (p.social && p.social.linkedin) p.socials.push({platform:'LinkedIn', url:''});
    if (p.social && p.social.facebook && !p.socials.some(s => s.platform === 'Facebook')) p.socials.push({platform:'Facebook', url:''});
    if (p.social && p.social.twitter) p.socials.push({platform:'Twitter', url:''});
  }
  if (!p.socials.length) p.socials = [{platform:'', url:''}];
  return p;
}
function emailList(p){return (p.emails||[]).map(e => typeof e === 'string' ? e : (e.address || ''));}
function dialRowHTML(key, raw, i, extra){
  const {code,number}=parseDial(raw);
  return `<div class="mv-combo">
    <select class="mv-prefix" onchange="commitDial('${key}',${i},this.value,this.parentNode.querySelector('.mv-body').value)">${dialOptions(code)}</select>
    <input class="mv-body" value="${escHtml(number)}" placeholder="${key==='wa'?'WhatsApp 号码':'手机号码'}" onblur="commitDial('${key}',${i},this.parentNode.querySelector('.mv-prefix').value,this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">
    ${extra?`<button class="mv-del" type="button" onclick="removeMv('${key}',${i})" title="删除">×</button>`:''}
  </div>`;
}
function plainRowHTML(key, v, i, extra, placeholder){
  return `<div class="mv-combo">
    <input class="mv-body" value="${escHtml(v)}" placeholder="${placeholder}" onblur="commitMv('${key}',${i},this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">
    ${extra?`<button class="mv-del" type="button" onclick="removeMv('${key}',${i})" title="删除">×</button>`:''}
  </div>`;
}
function mvFieldHTML(key, label, values, kind) {
  const list = (values && values.length) ? values : [''];
  const rows = list.map((v,i) => {
    const extra = list.length > 1;
    if (kind === 'dial') return dialRowHTML(key, v, i, extra);
    return plainRowHTML(key, v, i, extra, '邮箱地址');
  }).join('');
  return `<div class="pf-field mv">
    <div class="mv-head"><span class="mv-label">${label}</span><button class="mv-plus" type="button" onclick="addMv('${key}')">+</button></div>
    <div class="mv-rows">${rows}</div>
  </div>`;
}
function socialFieldHTML(p) {
  const list = (p.socials && p.socials.length) ? p.socials : [{platform:'', url:''}];
  const rows = list.map((s,i) => `<div class="mv-combo">
    <select class="mv-prefix" onchange="setSocialPlatform(${i},this.value)">
      <option value="">请选择</option>
      ${SOCIAL_PLATFORMS.map(pl => `<option value="${pl}" ${s.platform===pl?'selected':''}>${pl}</option>`).join('')}
    </select>
    <input class="mv-body" value="${escHtml(s.url||'')}" placeholder="主页链接" ${s.platform?'':'disabled'} onblur="setSocialUrl(${i},this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">
  </div>`).join('');
  return `<div class="pf-field mv">
    <div class="mv-head"><span class="mv-label">社媒</span><button class="mv-plus" type="button" onclick="addSocial()">+</button></div>
    <div class="mv-rows">${rows}</div>
  </div>`;
}
function pfFieldHTML(key, label, value, opts) {
  const v = dashVal(value), empty = !v, multi = opts && opts.multi ? '1' : '0';
  return `<div class="pf-field" data-key="${key}" data-label="${label}" data-multi="${multi}" onmouseenter="beginPfEdit(this)">
    <dt>${label}</dt><dd class="${empty?'ph':''}">${empty?'—':escHtml(v)}</dd></div>`;
}
function contactDrawerHTML(p) {
  ensurePerson(p);
  const co = p.companyName || '';
  const locked = quotaLockedPerson(p);
  const fields = locked
    ? `${maskedFieldHTML('WhatsApp')}${maskedFieldHTML('邮箱')}${maskedFieldHTML('手机')}${maskedFieldHTML('社媒')}${pfFieldHTML('role','职位', p.role)}${maskedFieldHTML('备注')}`
    : `${mvFieldHTML('wa','WhatsApp', p.was, 'dial')}
        ${mvFieldHTML('email','邮箱', emailList(p), 'plain')}
        ${mvFieldHTML('phone','手机', p.phones, 'dial')}
        ${socialFieldHTML(p)}
        ${pfFieldHTML('role','职位', p.role)}
        ${pfFieldHTML('notes','备注', p.notes, {multi:true})}`;
  return `<div class="cdrawer-head"><h3>联系人档案</h3><button class="cdrawer-close" type="button" onclick="closeContactDrawer()">×</button></div>
    <div class="cdrawer-body">
      <div class="cdrawer-name-row">
        <div class="cdrawer-av">${initials(p.name)}</div>
        <div class="cdrawer-id">
          <div class="cdrawer-name">${escHtml(p.name || '—')}</div>
          ${co ? `<div class="cdrawer-co">${escHtml(co)}</div>` : ''}
        </div>
      </div>
      <div class="pf-grid">${fields}</div>
    </div>`;
}
function maskedFieldHTML(label) {
  return `<div class="pf-field"><dt>${label}</dt><dd>${MASK}</dd></div>`;
}
let drawerPerson = null;
function refreshDrawer() {
  if (!drawerPerson) return;
  document.getElementById('cdrawer').innerHTML = contactDrawerHTML(drawerPerson);
}
function addMv(key) {
  if (!drawerPerson || quotaLockedPerson(drawerPerson)) return;
  if (key === 'email') { if (!drawerPerson.emails) drawerPerson.emails = []; drawerPerson.emails.push({address:'',type:'corporate',status:'verified'}); }
  else if (key === 'wa') { if (!drawerPerson.was) drawerPerson.was = []; drawerPerson.was.push(''); }
  else if (key === 'phone') { if (!drawerPerson.phones) drawerPerson.phones = []; drawerPerson.phones.push(''); }
  refreshDrawer();
}
function removeMv(key, i) {
  if (!drawerPerson) return;
  if (key === 'email') drawerPerson.emails.splice(i, 1);
  else if (key === 'wa') drawerPerson.was.splice(i, 1);
  else if (key === 'phone') drawerPerson.phones.splice(i, 1);
  toast('已保存');
  refreshDrawer();
}
function commitDial(key,i,code,number){
  if(!drawerPerson) return;
  const next=joinDial(code,number);
  if(key==='wa'){
    if(!drawerPerson.was) drawerPerson.was=[];
    drawerPerson.was[i]=next;
    drawerPerson.wa=drawerPerson.was.find(dashVal)||'';
  }else if(key==='phone'){
    if(!drawerPerson.phones) drawerPerson.phones=[];
    drawerPerson.phones[i]=next;
    drawerPerson.phone=drawerPerson.phones.find(dashVal)||'';
  }
}
function commitMv(key, i, value) {
  if (!drawerPerson) return;
  const next = String(value || '').trim();
  if (key === 'email') {
    if (!drawerPerson.emails) drawerPerson.emails = [];
    if (!drawerPerson.emails[i]) drawerPerson.emails[i] = {type:'corporate',status:'verified'};
    drawerPerson.emails[i].address = next;
    drawerPerson.email = drawerPerson.emails.map(e => typeof e === 'string' ? e : e.address).find(dashVal) || '';
  } else if (key === 'wa') {
    drawerPerson.was[i] = next;
    drawerPerson.wa = drawerPerson.was.find(dashVal) || '';
  } else if (key === 'phone') {
    drawerPerson.phones[i] = next;
    drawerPerson.phone = drawerPerson.phones.find(dashVal) || '';
  }
}
function addSocial() {
  if (!drawerPerson || quotaLockedPerson(drawerPerson)) return;
  if (!drawerPerson.socials) drawerPerson.socials = [];
  drawerPerson.socials.push({platform:'', url:''});
  refreshDrawer();
}
function removeSocial(i) {
  if (drawerPerson && drawerPerson.socials) drawerPerson.socials.splice(i, 1);
  toast('已保存');
  refreshDrawer();
}
function setSocialPlatform(i, platform) {
  if (!drawerPerson || !drawerPerson.socials || !drawerPerson.socials[i]) return;
  drawerPerson.socials[i].platform = platform;
  refreshDrawer();
}
function setSocialUrl(i, url) {
  if (!drawerPerson || !drawerPerson.socials || !drawerPerson.socials[i]) return;
  drawerPerson.socials[i].url = String(url || '').trim();
  const li = drawerPerson.socials.find(s => s.platform === 'LinkedIn');
  drawerPerson.linkedin = li && li.url || '';
  toast('已保存');
}
function beginPfEdit(el) {
  if (el.dataset.editing === '1' || !drawerPerson || quotaLockedPerson(drawerPerson)) return;
  document.querySelectorAll('.pf-field[data-editing="1"]').forEach(o => { if (o !== el) o.querySelector('.inline-input')?.blur(); });
  const key = el.dataset.key, multi = el.dataset.multi === '1';
  const val = drawerPerson[key] || '';
  el.dataset.editing = '1';
  el.innerHTML = multi
    ? `<dt>${el.dataset.label}</dt><textarea class="inline-input" onblur="commitPfEdit(this)">${escHtml(val)}</textarea>`
    : `<dt>${el.dataset.label}</dt><input class="inline-input" value="${escHtml(val)}" onblur="commitPfEdit(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">`;
  el.querySelector('.inline-input').focus();
}
function commitPfEdit(inp) {
  const el = inp.closest('.pf-field'); if (!el || !drawerPerson) return;
  const key = el.dataset.key, next = inp.value.trim();
  const prev = String(drawerPerson[key] || '').trim();
  drawerPerson[key] = next;
  el.dataset.editing = '0';
  const empty = !next;
  el.innerHTML = `<dt>${el.dataset.label}</dt><dd class="${empty?'ph':''}">${empty?'—':escHtml(next)}</dd>`;
  if (next !== prev) toast('已保存');
}
function openContactDrawer(id) {
  const p = CONTACTS.find(x => x.id === id);
  if (!p) return;
  if (quotaLockedPerson(p)) { quotaLimitToast(); return; }
  drawerPerson = ensurePerson(p);
  const el = document.getElementById('cdrawer');
  el.innerHTML = contactDrawerHTML(p);
  el.classList.add('show');
  document.getElementById('cdrawer-mask').classList.add('show');
}
function closeContactDrawer() {
  document.querySelectorAll('.pf-field[data-editing="1"] .inline-input').forEach(inp => inp.blur());
  document.getElementById('cdrawer').classList.remove('show');
  document.getElementById('cdrawer-mask').classList.remove('show');
}

function copyReach(text) {
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => toast('已复制 ' + text)).catch(() => toast(text));
}

function applyFilters() {
  appliedFilters = {
    kw: (document.getElementById('kw-input').value || '').trim().toLowerCase(),
    source: document.getElementById('sel-source').value,
    owner: [...selectedCrmOwners],
    stage: document.getElementById('sel-stage').value,
    interact: document.getElementById('sel-interact').value,
    created: document.getElementById('sel-created').value
  };
  renderList();
}
function resetFilters() {
  selectedCrmOwners = [];
  document.getElementById('kw-input').value = '';
  document.getElementById('sel-source').value = '';
  document.getElementById('sel-stage').value = '';
  syncCrmOwnerTrigger();
  renderCrmOwnerOptions();
  document.getElementById('sel-interact').value = '';
  document.getElementById('sel-created').value = '';
  applyFilters();
}

function toast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

const params = new URLSearchParams(location.search);
if (params.get('source') === 'agent') {
  document.getElementById('sel-source').value = '潜客挖掘agent';
  applyFilters();
} else {
  syncFilterBar();
  renderList();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeArchiveModal(); closeListFollow(); closeContactDrawer(); closeAssignDialog(); closeDeleteDialog(); hidePeopleTip(); closeRowMenus(); } });
document.addEventListener('click', () => { closeRowMenus(); const ownerMenu=document.getElementById('crm-owner-menu'); if(ownerMenu) ownerMenu.hidden=true; });
document.querySelector('.list-area')?.addEventListener('scroll', hidePeopleTip);

function tourPrep() {
  closeContactDrawer();
  hidePeopleTip();
  resetFilters();
}
function startCrmTour(force) {
  if (!window.TradeOnboarding) return;
  const first = (typeof getList === 'function' ? getList() : [])[0];
  const detailHref = first ? ('customer-detail.html?id=' + encodeURIComponent(first.id) + '&tour=1') : '';
  const steps = [
    { kicker:'客户管理', sel:'#tour-ent-row', title:'客户概览', body:'查看客户阶段、来源、联系人和最近互动，快速识别优先跟进客户。点击行区域进入详情。', before: tourPrep, href: detailHref, continue: true, doneLabel:'下一步' }
  ].filter(function (s) { return !s.sel || s.before || document.querySelector(s.sel); });
  TradeOnboarding.start(steps, { storageKey: 'crm', force: !!force, offset: 0, total: 5 });
}
setTimeout(function () {
  startCrmTour(new URLSearchParams(location.search).get('tour') === '1');
}, 500);
</script>
</body>
</html>
