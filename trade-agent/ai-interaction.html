const people=['王强','张三','李四','王五','陈敏','刘辉','李娜','赵雨','周明','孙悦','吴凡','郑洁','黄磊','马骏','何倩','徐航','郭颖','罗浩','蒋欣','冯涛','魏晨','彭琳','曹宇','唐宁','宋扬'];
const avatarInitial=name=>String(name||'—').trim().slice(0,1)||'—';
let selected={id:5,name:'M',channel:'WhatsApp私信',kind:'wa',owner:'王强',account:'授权号634523',intent:'高意向',status:'已转客户',form:'私信',preview:'这个产品确实可以，你可以看看',time:'9-10',messages:[['in','¡Hola, quiero consultar el coche de la montaña, ¿qué estilo tenéis?','你好，我想咨询一下山地车，你们有什么款式呢？',''],['in','¡Hola, quiero consultar el coche de la montaña, ¿qué estilo tenéis?','你好，我想咨询一下山地车，你们有什么款式呢？','16:58'],['out','这个产品确实可以，你可以看看','这个产品确实可以，你可以看看',''] ]};
let conversations=[{id:1,name:'舒适性是临床优…',channel:'LinkedIn评论',kind:'dark',owner:'王强',intent:'',status:'',form:'评论',preview:'舒适性是临床优先事项，而不仅仅是附加功能',time:'09:50',postText:'舒适性是临床优先事项，而不仅仅是附加功能',postTime:'9-10 17:23:02 发布',commentAuthor:'用户jnZQztXdm0',commentText:'试试就试试',commentTime:'9-10 17:29:50'},{id:2,name:'陈小小',channel:'WhatsApp私信',kind:'wa',owner:'陈敏',intent:'高意向',status:'已转客户',form:'私信',preview:'[图片]',time:'9-14'},{id:3,name:'启磊 周',channel:'WhatsApp私信',kind:'dark',owner:'刘辉',intent:'低意向',status:'待处理',form:'私信',preview:'[图片]',time:'9-11'},{id:4,name:'appollo20261',channel:'Instagram私信',kind:'orange',owner:'王强',intent:'低意向',status:'跟进中',form:'私信',preview:'Sorry, your WhatsApp number is?',time:'9-11'},{id:5,...selected},{id:6,name:'再发一个呢',channel:'VKontakte评论',kind:'orange',owner:'陈敏',intent:'',status:'',form:'评论',preview:'11',time:'9-11',postText:'再发一个呢',postTime:'9-11 10:20 发布',commentAuthor:'用户',commentText:'11',commentTime:'9-11 10:26'},{id:7,name:'哈哈哈哈哈测试一下',channel:'VKontakte评论',kind:'orange',owner:'刘辉',intent:'',status:'',form:'评论',preview:'1111',time:'9-11',postText:'哈哈哈哈哈测试一下',postTime:'9-11 09:40 发布',commentAuthor:'用户',commentText:'1111',commentTime:'9-11 09:42'},{id:8,name:'XiaoQiang88888…',channel:'WhatsApp私信',kind:'wa',owner:'王强',intent:'高意向',status:'已转客户',form:'私信',preview:'[图片]',time:'9-10'}];
let selectedOwners=['王强'];
function init(){document.getElementById('owner-selector-trigger').hidden=role==='rep';renderOwnerOptions();document.getElementById('channel-checks').innerHTML=channels.map(([name,cls,icon])=>`<label class="check channel-check"><input type="checkbox" data-filter="channel" value="${name}"><span class="channel-dot ${cls}">${icon}</span>${name}</label>`).join('');renderConversations();renderChat();}
function renderOwnerOptions(){const term=(document.getElementById('owner-search')?.value||'').trim(),items=people.filter(name=>name!=='王强'&&name.includes(term)),allSelected=selectedOwners.length===people.length;const presets=`<label class="owner-option"><input type="checkbox" ${allSelected?'checked':''} onchange="setAllOwners(this.checked)"><span class="owner-mini-avatar">全</span>全部</label><label class="owner-option"><input type="checkbox" ${selectedOwners.includes('王强')?'checked':''} onchange="setOwnerFilter('王强',this.checked)"><span class="owner-mini-avatar">我</span>我的</label>`;document.getElementById('owner-options').innerHTML=presets+(items.map(name=>`<label class="owner-option"><input type="checkbox" data-filter="owner" value="${name}" ${selectedOwners.includes(name)?'checked':''} onchange="setOwnerFilter('${name}',this.checked)"><span class="owner-mini-avatar">${name[0]}</span>${name}</label>`).join('')||'<p style="margin:9px;color:#8a99ad;font-size:12px">未找到人员</p>');updateOwnerSelector()}
function setOwnerFilter(name,checked){selectedOwners=checked?[...selectedOwners,name]:selectedOwners.filter(item=>item!==name);updateOwnerSelector()}
function setAllOwners(checked){selectedOwners=checked?[...people]:[];renderOwnerOptions()}
function updateOwnerSelector(){const trigger=document.getElementById('owner-selector-trigger');trigger.textContent=selectedOwners.length===people.length?'全部':selectedOwners.length===1&&selectedOwners[0]==='王强'?'我的':selectedOwners.length?`${selectedOwners.length}人`:'负责人'}
function toggleOwnerPicker(event){event.stopPropagation();const picker=document.getElementById('owner-picker'),rect=event.currentTarget.getBoundingClientRect();picker.hidden=!picker.hidden;if(!picker.hidden){picker.style.left=`${rect.left}px`;picker.style.top=`${rect.bottom+5}px`;document.getElementById('owner-search').value='';renderOwnerOptions();document.getElementById('owner-search').focus()}}
function renderConversations(){const term=document.getElementById('search').value.trim().toLowerCase(),filters=readFilters(),list=conversations.filter(c=>(!term||`${c.name}${c.preview}`.toLowerCase().includes(term))&&match(c,filters));document.getElementById('conversation-list').innerHTML=list.length?list.map(c=>`<article class="conversation ${c.id===selected.id?'active':''}" onclick="selectConversation(${c.id})"><div class="person-avatar ${c.kind}">${avatarInitial(c.name)}</div><div class="conversation-main"><div class="conversation-top"><span class="conversation-name">${c.name}</span><span class="channel">${c.channel}</span><span class="time">${c.time}</span></div><p class="preview">${c.preview}</p>${c.intent?`<span class="tag ${c.intent==='低意向'?'low':''}">${c.intent}</span>`:''}${c.status?`<span class="tag ${c.status==='待处理'?'wait':''}">${c.status}</span>`:''}</div></article>`).join(''):'<p style="padding:32px;text-align:center;color:#8a99ad;font-size:13px">暂无匹配会话</p>'}
function readFilters(){const values=type=>[...document.querySelectorAll(`[data-filter="${type}"]:checked`)].map(x=>x.value);return {owner:role==='rep'?['王强']:selectedOwners,status:values('status'),intent:values('intent'),form:values('form'),channel:values('channel')}}
function match(c,f){return (!f.owner.length||f.owner.includes(c.owner))&&(!f.status.length||f.status.includes(c.status))&&(!f.intent.length||f.intent.includes(c.intent))&&(!f.form.length||f.form.includes(c.form))&&(!f.channel.length||f.channel.some(x=>c.channel.includes(x)))}
function selectConversation(id){selected=conversations.find(c=>c.id===id);if(selected.form!=='评论'&&!selected.messages)selected.messages=[['in','您好，想了解更多产品信息。','您好，想了解更多产品信息。','10:20']];renderConversations();renderChat()}
function channelFor(label){const text=String(label||'');return channels.find(([name])=>text.includes(name))||['独立站','site','⌂']}
function renderCommentThread(){const postText=selected.postText||selected.preview||'暂无贴文内容',commentText=selected.commentText||selected.preview||'暂无评论内容',postTime=selected.postTime||`${selected.time||''} 发布`,commentTime=selected.commentTime||selected.time||'';return `<div class="comment-thread"><article class="comment-post-card"><div class="comment-post-title">${postText}</div><div class="comment-post-image" aria-label="贴文配图">⚙</div><div class="comment-post-meta"><span>${postTime}</span><span>♡ 0　◌ 3</span></div></article><article class="comment-item-card"><div class="comment-item-avatar">${(selected.commentAuthor||'用户').slice(0,1)}</div><div><div class="comment-item-head"><span>${selected.commentAuthor||'用户'}</span><span class="comment-item-time">${commentTime}</span></div><div class="comment-item-copy">${commentText}</div><div class="comment-item-reply">↩ 回复</div></div></article></div>`}
function renderChat(){document.getElementById('head-avatar').className=`person-avatar ${selected.kind}`;document.getElementById('head-avatar').textContent=avatarInitial(selected.name);const channel=channelFor(selected.channel),headChannel=document.getElementById('head-channel-icon');headChannel.className=`channel-head-icon ${channel[1]}`;headChannel.textContent=channel[2];headChannel.title=`来源渠道：${channel[0]}`;headChannel.setAttribute('aria-label',`来源渠道：${channel[0]}`);document.getElementById('chat-name').textContent=selected.name;document.getElementById('owner-button').textContent=selected.owner||'未分配';const accountName=selected.account||'授权号634523';document.getElementById('account-label').textContent=accountName;document.getElementById('crm-button').hidden=!((selected.form==='私信'||selected.form==='表单')&&['待处理','跟进中'].includes(selected.status));document.getElementById('messages').innerHTML=selected.form==='评论'?renderCommentThread():selected.messages.map((m,i)=>`${i===2?'<div class="date">09月10日</div>':''}<div class="msg ${m[0]}"><div class="bubble">${m[1]}${m[2]&&m[2]!==m[1]?`<span class="translation">${m[2]}</span>`:''}</div>${m[3]?`<div class="message-meta">${m[3]}</div>`:''}</div>`).join('');const box=document.getElementById('messages');box.scrollTop=box.scrollHeight;}
function sendReply(){const input=document.getElementById('reply'),text=input.value.trim();if(!text)return;selected.messages.push(['out',text,text,'']);selected.preview=text;input.value='';renderConversations();renderChat()}
function toggleFilter(event){event.stopPropagation();const pop=document.getElementById('filter-pop'),button=event.currentTarget,rect=button.getBoundingClientRect();pop.style.left=`${rect.left+12}px`;pop.style.top=`${rect.bottom}px`;pop.hidden=!pop.hidden;button.classList.toggle('active',!pop.hidden)}
function applyFilters(){document.getElementById('filter-pop').hidden=true;document.getElementById('filter-button').classList.add('active');renderConversations()}
function resetFilters(){selectedOwners=['王强'];document.querySelectorAll('#filter-pop input').forEach(x=>x.checked=x.type==='radio'&&x.value==='全部');renderOwnerOptions();renderConversations()}
function toggleOwnerMenu(event){event.stopPropagation();const menu=document.getElementById('owner-menu'),rect=event.currentTarget.getBoundingClientRect();menu.innerHTML=people.map(p=>`<button type="button" onclick="assignOwner('${p}')"><span class="owner-menu-avatar">${p[0]}</span><span>${p}</span>${p===selected.owner?'<b class="owner-menu-check">✓</b>':''}</button>`).join('');menu.hidden=!menu.hidden;if(!menu.hidden){const width=148,left=Math.min(window.innerWidth-width-8,Math.max(8,rect.right-width));menu.style.left=`${left}px`;menu.style.top=`${Math.min(window.innerHeight-290,rect.bottom+4)}px`}}
function assignOwner(person){selected.owner=person;conversations=conversations.map(c=>c.id===selected.id?selected:c);document.getElementById('owner-menu').hidden=true;renderConversations();renderChat();toast(`已重新分配给${person}`)}
function saveToCrm(){selected.status='已转客户';conversations=conversations.map(c=>c.id===selected.id?selected:c);renderConversations();renderChat();toast('已存入 AI CRM')}
function toast(text){const node=document.getElementById('toast');node.textContent=text;node.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>node.classList.remove('show'),1800)}
document.addEventListener('click',()=>{document.getElementById('filter-pop').hidden=true;document.getElementById('filter-button').classList.remove('active');document.getElementById('owner-menu').hidden=true;document.getElementById('owner-picker').hidden=true});init();
</script>
</body></html>
